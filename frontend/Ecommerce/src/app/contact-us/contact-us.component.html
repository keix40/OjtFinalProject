<div class="min-h-screen bg-gradient-to-b from-neutral-50 to-white flex flex-col items-center py-10 px-4 sm:px-6 lg:px-8">
  <div class="w-full max-w-4xl bg-white rounded-3xl shadow-xl p-8 sm:p-12 flex flex-col gap-8">
    <!-- Contact Form -->
    <div class="flex flex-col gap-8">
      <div class="text-center mb-4">
        <h1 class="text-3xl font-extrabold text-black mb-2">Contact Us</h1>
        <p class="text-neutral-700">We'd love to hear from you! Fill out the form below and our team will get back to you soon.</p>
      </div>
      <form class="flex flex-col gap-5">
        <div>
          <label for="name" class="block text-sm font-medium text-neutral-700 mb-1">Name</label>
          <input id="name" name="name" type="text" class="w-full px-4 py-3 border border-neutral-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-neutral-900 bg-neutral-50" placeholder="Your Name" />
        </div>
        <div>
          <label for="email" class="block text-sm font-medium text-neutral-700 mb-1">Email</label>
          <input id="email" name="email" type="email" class="w-full px-4 py-3 border border-neutral-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-neutral-900 bg-neutral-50" placeholder="you@email.com" />
        </div>
        <div>
          <label for="subject" class="block text-sm font-medium text-neutral-700 mb-1">Subject</label>
          <input id="subject" name="subject" type="text" class="w-full px-4 py-3 border border-neutral-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-neutral-900 bg-neutral-50" placeholder="Subject" />
        </div>
        <div>
          <label for="message" class="block text-sm font-medium text-neutral-700 mb-1">Message</label>
          <textarea id="message" name="message" rows="5" class="w-full px-4 py-3 border border-neutral-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-black focus:border-black transition text-neutral-900 bg-neutral-50 resize-none" placeholder="Type your message here..."></textarea>
        </div>
        <button type="submit" class="mt-2 w-full px-6 py-3 bg-black text-white font-semibold rounded-xl shadow hover:bg-neutral-900 transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-black focus:ring-opacity-50">Send Message</button>
      </form>
    </div>
    <!-- Contact Details Card -->
    <div class="flex flex-col justify-center">
      <div class="bg-neutral-100 rounded-2xl shadow-md p-6 flex flex-col gap-4">
        <h2 class="text-xl font-bold text-black mb-2">Contact Details</h2>
        <div class="flex items-center gap-3">
          <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H5a2 2 0 01-2-2V5zm0 14a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5a2 2 0 00-2 2v2zm14-14a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5a2 2 0 012-2h2zm0 14a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2h-2a2 2 0 00-2 2v2z"/></svg>
          <span class="text-neutral-800">+95 9 123 456 789</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 12H8m8 0a4 4 0 11-8 0 4 4 0 018 0zm0 0v1a4 4 0 01-4 4H8a4 4 0 01-4-4v-1"/></svg>
          <span class="text-neutral-800">support&#64;ourshop.com</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 12.414a2 2 0 00-2.828 0l-4.243 4.243A8 8 0 1116.657 7.343z"/></svg>
          <span class="text-neutral-800">123 Yangon Street, Myanmar</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10m-9 4h6m-7 4h8"/></svg>
          <span class="text-neutral-800">Mon–Fri, 9AM–6PM</span>
        </div>
      </div>
    </div>
  </div>
</div>
