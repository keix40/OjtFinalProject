<lux-page-shell variant="admin">
  <lux-page-header
    variant="admin"
    eyebrow="Account"
    title="Admin Profile"
    subtitle="Manage your admin account details and preferences.">
    <lux-button
      actions
      type="button"
      [variant]="isEditing ? 'accent' : 'secondary'"
      (pressed)="toggleEditMode()">
      {{ isEditing ? 'Editing' : 'Edit Profile' }}
    </lux-button>
  </lux-page-header>

  <div class="lux-profile-layout">
    <lux-card eyebrow="Identity" title="">
      <div class="lux-profile-aside">
        <div class="lux-avatar-wrap">
          <div class="lux-avatar">
            <ng-container *ngIf="adminDetails?.profileImage && adminDetails?.profileImage !== '/upload/defaultProfile.png'; else showDefaultIcon">
              <img [src]="getProfileImageUrl()" alt="Profile image" />
            </ng-container>
            <ng-template #showDefaultIcon>
              <div class="lux-avatar__fallback" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
              </div>
            </ng-template>
          </div>
          <button
            *ngIf="isEditing"
            type="button"
            class="lux-avatar__edit"
            (click)="triggerFileInput(fileInput)">
            Change photo
          </button>
        </div>
        <input type="file" #fileInput accept="image/*" hidden (change)="onFileSelected($event)">

        <h2 class="lux-profile-name">{{ personalInfoForm.get('name')?.value || 'Admin' }}</h2>
        <lux-badge tone="info">{{ getUserRolesDisplay() }}</lux-badge>

        <div class="lux-profile-logout">
          <lux-button type="button" variant="ghost" block (pressed)="logout()">Logout</lux-button>
        </div>
      </div>
    </lux-card>

    <lux-card eyebrow="Details" title="Admin information">
      <form [formGroup]="personalInfoForm" class="lux-settings-form">
        <div class="lux-settings-grid">
          <lux-field label="Full name" inputId="name">
            <input
              id="name"
              type="text"
              class="lux-input"
              formControlName="name"
              placeholder="Enter your full name" />
          </lux-field>

          <lux-field label="Email address" inputId="email">
            <input
              id="email"
              type="email"
              class="lux-input"
              formControlName="email"
              placeholder="Enter your email" />
          </lux-field>

          <lux-field label="Gender" inputId="gender">
            <select id="gender" class="lux-select" formControlName="gender">
              <option value="">Select Gender</option>
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </lux-field>

          <lux-field label="Date of birth" inputId="dateOfBirth">
            <input
              id="dateOfBirth"
              type="date"
              class="lux-input"
              formControlName="dateOfBirth" />
          </lux-field>

          <lux-field
            class="lux-settings-grid__full"
            label="Phone number"
            inputId="phoneNumber"
            [error]="isPhoneEmpty() ? 'Phone number is empty.' : ''"
            [hint]="isPhoneUnverified() ? 'Phone number is not verified yet.' : ''">
            <input
              id="phoneNumber"
              type="text"
              class="lux-input"
              formControlName="phoneNumber"
              placeholder="Enter your phone number" />
          </lux-field>
        </div>

        <div *ngIf="isEditing" class="lux-settings-actions">
          <lux-button type="button" variant="primary" (pressed)="saveChanges()">Save Changes</lux-button>
          <lux-button type="button" variant="secondary" (pressed)="cancelEdit()">Cancel</lux-button>
        </div>
      </form>
    </lux-card>
  </div>
</lux-page-shell>
