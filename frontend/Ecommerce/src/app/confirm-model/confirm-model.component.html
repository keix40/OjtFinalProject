<div class="modal-header admin-modal__header">
    <h5 class="admin-modal__title">Confirm</h5>
    <button type="button" class="admin-modal-close" aria-label="Close" (click)="activeModal.dismiss()">&times;</button>
  </div>
  <div class="modal-body admin-modal__body">
    <p>{{ message }}</p>
  </div>
  <div class="modal-footer admin-modal__footer">
    <button type="button" class="lux-btn lux-btn--primary" (click)="activeModal.close(true)">Yes</button>
    <button type="button" class="lux-btn lux-btn--secondary" (click)="activeModal.dismiss()">No</button>
  </div>
