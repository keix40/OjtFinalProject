<form #subCatForm="ngForm" (ngSubmit)="submit(subCatForm)" class="w-full max-w-2xl mx-auto">
  <!-- Modal Header -->
  <div class="bg-gradient-to-r from-gray-800 to-gray-900 text-white rounded-t-lg p-6 border-b border-gray-700">
    <div class="flex items-center justify-between">
      <h5 class="text-xl font-bold text-white">Add Subcategories</h5>
      <button 
        type="button" 
        class="text-gray-300 hover:text-white transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-white focus:ring-opacity-50 rounded-full p-1"
        (click)="activeModal.dismiss()"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Modal Body -->
  <div class="bg-white p-6 space-y-6">
    <!-- Parent Category (disabled) -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Parent Category:</label>
      <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-gray-100 text-gray-700" [value]="parentCategory?.name" disabled />
    </div>

    <!-- Subcategory Multi-Select -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Select Subcategories:</label>
      <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" multiple [(ngModel)]="selectedSubCategoryNames" name="subCategoryNames" required>
        <option *ngFor="let c of getSubCategoryOptions()" [ngValue]="c.name">{{ c.name }}</option>
      </select>
      <div class="text-xs text-gray-500 mt-1">Hold Ctrl (Windows) or Cmd (Mac) to select multiple subcategories.</div>
    </div>
  </div>

  <!-- Modal Footer -->
  <div class="bg-gray-50 px-6 py-4 rounded-b-lg border-t border-gray-200">
    <button 
      type="submit" 
      class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 transform hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
      [disabled]="!subCatForm.valid || selectedSubCategoryNames.length === 0"
    >
      <span class="flex items-center justify-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
        </svg>
        Add Subcategories
      </span>
    </button>
  </div>
</form>
