<form #subCatForm="ngForm" (ngSubmit)="submit(subCatForm)" class="admin-modal admin-modal--lg relative">
  <button type="button" class="admin-modal-close" (click)="activeModal.dismiss()" aria-label="Close">&times;</button>
  <div class="admin-modal__header">
    <h5 class="admin-modal__title">Add Subcategories</h5>
  </div>
  <div class="admin-modal__body space-y-6">
    <div class="space-y-2">
      <label class="lux-field-label">Parent Category</label>
      <input type="text" class="lux-input" [value]="parentCategory?.name" disabled />
    </div>
    <div class="space-y-2">
      <label class="lux-field-label">Select Subcategories</label>
      <select
        class="lux-select admin-multiselect"
        multiple
        [(ngModel)]="selectedSubCategoryNames"
        name="subCategoryNames"
        required
      >
        <option *ngFor="let c of getSubCategoryOptions()" [ngValue]="c.name">{{ c.name }}</option>
      </select>
      <p class="lux-field-hint">Hold Ctrl (Windows) or Cmd (Mac) to select multiple subcategories.</p>
    </div>
  </div>
  <div class="admin-modal__footer">
    <button type="button" class="lux-btn lux-btn--ghost" (click)="activeModal.dismiss()">Cancel</button>
    <button
      type="submit"
      class="lux-btn lux-btn--primary"
      [disabled]="!subCatForm.valid || selectedSubCategoryNames.length === 0"
    >
      Add Subcategories
    </button>
  </div>
</form>
