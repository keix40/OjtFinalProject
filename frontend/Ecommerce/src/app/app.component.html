<app-notification-sidebar [showNotificationSidebar]="showNotificationSidebar" (closeNotificationSidebar)="closeNotificationSidebar()"></app-notification-sidebar>
<router-outlet />

<!-- Go to Top Button -->
<button 
  *ngIf="showGoToTop" 
  (click)="scrollToTop()"
  class="fixed bottom-6 right-6 z-40 w-12 h-12 bg-white hover:bg-blue-50 text-blue-600 border-2 border-blue-200 hover:border-blue-400 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-110 active:scale-95 group flex items-center justify-center"
  title="Go to top">
  <svg class="w-6 h-6 transition-all duration-300 group-hover:-translate-y-1 group-hover:text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
  </svg>
</button>

<!-- Toast Notification -->
<div *ngIf="toastMessage" class="fixed top-24 left-1/2 -translate-x-1/2 z-50"
     [ngClass]="isToastClosing ? 'animate-fade-out-down' : 'animate-fade-in-down'"
     (click)="onToastClick()">
  <div class="relative flex items-center gap-4 px-6 py-4 rounded-2xl shadow-xl bg-white/80 backdrop-blur-md border border-blue-100 min-w-[320px] max-w-[90vw] pointer-events-auto">
    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-100 shadow-inner">
      <i class="bi bi-bell-fill text-2xl text-blue-600"></i>
    </div>
    <span class="flex-1 text-base font-semibold text-blue-900 tracking-wide">{{ toastMessage }}</span>
    <button class="absolute top-2 right-2 p-1 rounded-full hover:bg-blue-100 transition" (click)="closeToast($event)">
      <i class="bi bi-x-lg text-blue-400 text-lg"></i>
    </button>
  </div>
</div>
