<app-notification-sidebar [showNotificationSidebar]="showNotificationSidebar" (closeNotificationSidebar)="closeNotificationSidebar()"></app-notification-sidebar>
<router-outlet />

<!-- Go to Top -->
<button
  *ngIf="showGoToTop"
  type="button"
  (click)="scrollToTop()"
  class="lux-goto-top"
  title="Go to top"
  aria-label="Go to top"
>
  <svg class="lux-goto-top__icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
  </svg>
</button>

<!-- Toast -->
<div
  *ngIf="toastMessage"
  class="lux-app-toast"
  [class.is-closing]="isToastClosing"
  (click)="onToastClick()"
  role="status"
>
  <div class="lux-app-toast__panel">
    <span class="lux-app-toast__mark" aria-hidden="true"></span>
    <span class="lux-app-toast__text">{{ toastMessage }}</span>
    <button type="button" class="lux-app-toast__close" (click)="closeToast($event)" aria-label="Dismiss">
      ×
    </button>
  </div>
</div>
