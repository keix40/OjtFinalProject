<form #updateCategoryForm="ngForm" (ngSubmit)="updateCategory(updateCategoryForm)" class="w-full max-w-xl mx-auto bg-white rounded-xl shadow-2xl p-6 md:p-8 relative">
  <!-- Close Button -->
  <button 
    type="button" 
    class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold focus:outline-none"
    (click)="activeModal.dismiss()"
    aria-label="Close"
  >
    &times;
  </button>
  <!-- Modal Title -->
  <div class="mb-6 text-center">
    <h5 class="text-2xl font-bold text-gray-900">Update Category</h5>
  </div>
  <!-- Modal Body -->
  <div class="space-y-6">
    <!-- Parent Category -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Main Category (optional):</label>
      <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" name="parentCategoryId" [(ngModel)]="selectedParentCategoryId">
        <option [ngValue]="null" selected>-- No Parent (Main Category) --</option>
        <option *ngFor="let c of categories" [ngValue]="c.id" [disabled]="c.id === categoryId">{{ c.name }}</option>
      </select>
    </div>
    <!-- Category Name -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Category Name:</label>
      <input
        type="text"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
        name="categoryName"
        [(ngModel)]="categoryNames[0]"
        required
        placeholder="Enter category name"
      />
    </div>
    <!-- Category Image Upload -->
    <div class="space-y-3">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Category Image:</label>
      <div class="relative">
        <input
          type="file"
          class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
          (change)="onImageSelected($event)"
          accept="image/*"
          id="categoryImageInput"
        />
        <label for="categoryImageInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-400 rounded-xl bg-blue-50 hover:bg-blue-100 transition-colors duration-200 cursor-pointer select-none text-center p-6">
          <svg class="h-14 w-14 text-blue-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="text-base font-medium text-blue-700">Click to upload or drag and drop</span>
          <span class="text-xs text-gray-500 mt-1">PNG, JPG, GIF up to 10MB</span>
        </label>
      </div>
    </div>
    <!-- Image preview -->
    <div *ngIf="imagePreviewUrl" class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Image Preview:</label>
      <div class="relative inline-block">
        <img [src]="imagePreviewUrl" alt="Image Preview" class="max-w-[120px] max-h-[90px] rounded-lg shadow-md border border-gray-200 object-contain" />
        <button 
          type="button"
          class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600 transition-colors duration-200"
          (click)="removeImage()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- Modal Footer -->
  <div class="flex justify-end gap-2 mt-8">
    <button 
      type="button"
      class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm"
      (click)="activeModal.dismiss()"
    >
      Cancel
    </button>
    <button 
      type="submit" 
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-semibold flex items-center gap-2"
      [disabled]="!updateCategoryForm.valid || !permissionService.hasPermission(PermissionConstants.CATEGORIES_UPDATE)"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
      </svg>
      Update Category
    </button>
  </div>
</form>
