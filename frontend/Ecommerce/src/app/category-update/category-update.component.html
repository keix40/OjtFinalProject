<form #updateCategoryForm="ngForm" (ngSubmit)="updateCategory(updateCategoryForm)" class="admin-modal admin-modal--lg relative">
  <button type="button" class="admin-modal-close" (click)="activeModal.dismiss()" aria-label="Close">&times;</button>
  <div class="admin-modal__header">
    <h5 class="admin-modal__title">Update Category</h5>
  </div>
  <div class="admin-modal__body space-y-6">
    <div class="space-y-2">
      <label class="lux-field-label">Main Category (optional)</label>
      <select class="lux-select" name="parentCategoryId" [(ngModel)]="selectedParentCategoryId">
        <option [ngValue]="null" selected>-- No Parent (Main Category) --</option>
        <option *ngFor="let c of categories" [ngValue]="c.id" [disabled]="c.id === categoryId">{{ c.name }}</option>
      </select>
    </div>
    <div class="space-y-2">
      <label class="lux-field-label">Category Name</label>
      <input
        type="text"
        class="lux-input"
        name="categoryName"
        [(ngModel)]="categoryNames[0]"
        required
        placeholder="Enter category name"
      />
    </div>
    <div class="space-y-3">
      <label class="lux-field-label">Category Image</label>
      <div class="admin-upload">
        <input type="file" class="admin-upload__input" (change)="onImageSelected($event)" accept="image/*" id="categoryImageInput" />
        <label for="categoryImageInput" class="admin-upload__label">Click to upload or drag and drop · PNG, JPG, GIF up to 10MB</label>
      </div>
    </div>
    <div *ngIf="imagePreviewUrl" class="space-y-2">
      <label class="lux-field-label">Image Preview</label>
      <div class="relative inline-block">
        <img [src]="imagePreviewUrl" alt="Image Preview" class="admin-preview-img" />
        <button type="button" class="admin-preview-remove" (click)="removeImage()" aria-label="Remove image">×</button>
      </div>
    </div>
  </div>
  <div class="admin-modal__footer">
    <button type="button" class="lux-btn lux-btn--ghost" (click)="activeModal.dismiss()">Cancel</button>
    <button
      type="submit"
      class="lux-btn lux-btn--primary"
      [disabled]="!updateCategoryForm.valid || !permissionService.hasPermission(PermissionConstants.CATEGORIES_UPDATE)"
    >
      Update Category
    </button>
  </div>
</form>
