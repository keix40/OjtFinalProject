<lux-page-shell variant="admin">
  <lux-page-header
    variant="admin"
    eyebrow="Settings"
    title="Store Policies"
    subtitle="Create and manage the policies shown to customers.">
  </lux-page-header>

  <lux-card [eyebrow]="editingPolicy ? 'Edit' : 'Create'" [title]="editingPolicy ? 'Update policy' : 'New policy'">
    <form [formGroup]="policyForm" (ngSubmit)="submitForm()" class="lux-settings-form">
      <div class="lux-settings-grid">
        <lux-field
          label="Policy title"
          inputId="title"
          [error]="policyForm.get('title')?.invalid && policyForm.get('title')?.touched ? 'Policy title is required' : ''">
          <input
            type="text"
            id="title"
            class="lux-input"
            formControlName="title"
            placeholder="Enter policy title" />
        </lux-field>

        <lux-field label="Status" inputId="status">
          <select id="status" class="lux-select" formControlName="status">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </lux-field>
      </div>

      <lux-field
        label="Policy content"
        inputId="content"
        [error]="policyForm.get('content')?.invalid && policyForm.get('content')?.touched ? 'Policy content is required' : ''">
        <div class="lux-quill-shell">
          <quill-editor
            formControlName="content"
            [modules]="quillModules"
            theme="snow"
            placeholder="Enter policy content..."
            class="quill-editor-fixed">
          </quill-editor>
        </div>
      </lux-field>

      <div class="lux-settings-actions">
        <lux-button
          *ngIf="editingPolicy"
          type="button"
          variant="secondary"
          (pressed)="cancelEdit()">
          Cancel
        </lux-button>
        <lux-button
          type="submit"
          variant="primary"
          [disabled]="policyForm.invalid"
          [loading]="loading">
          {{ editingPolicy ? 'Update Policy' : 'Create Policy' }}
        </lux-button>
      </div>
    </form>
  </lux-card>

  <lux-card eyebrow="Library" title="Existing policies">
    <div class="lux-card-meta" *ngIf="!loading">
      <lux-badge>{{ policies.length }} policies</lux-badge>
    </div>

    <div *ngIf="loading" class="lux-loading-block">
      <lux-skeleton width="100%" height="12rem"></lux-skeleton>
    </div>

    <lux-empty-state
      *ngIf="!loading && policies.length === 0"
      eyebrow="Policies"
      title="No policies yet"
      message="Create your first policy to get started.">
    </lux-empty-state>

    <div *ngIf="!loading && policies.length > 0" class="lux-policy-table-wrap">
      <table class="lux-admin-table">
        <thead>
          <tr>
            <th class="lux-admin-table__check">
              <input
                type="checkbox"
                [(ngModel)]="selectAll"
                (change)="toggleAllCheckboxes()"
                aria-label="Select all policies" />
            </th>
            <th>Policy</th>
            <th>Preview</th>
            <th>Status</th>
            <th>Updated</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let policy of policies">
            <td class="lux-admin-table__check">
              <input
                type="checkbox"
                [(ngModel)]="policy.checked"
                (change)="updateSelection()"
                aria-label="Select policy" />
            </td>
            <td>
              <div class="lux-policy-title">{{ policy.title }}</div>
            </td>
            <td>
              <div class="policy-content-preview line-clamp-2" [innerHTML]="policy.content"></div>
            </td>
            <td>
              <lux-badge *ngIf="policy.status === 1" tone="success">Active</lux-badge>
              <lux-badge *ngIf="policy.status === 0">Inactive</lux-badge>
            </td>
            <td class="lux-muted">{{ policy.lastUpdated | date:'medium' }}</td>
            <td>
              <div class="lux-row-actions">
                <lux-button type="button" variant="ghost" (pressed)="viewPolicyDetail(policy)">View</lux-button>
                <lux-button type="button" variant="secondary" (pressed)="editPolicy(policy)">Edit</lux-button>
                <lux-button type="button" variant="ghost" (pressed)="deletePolicy(policy.id)">Delete</lux-button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </lux-card>
</lux-page-shell>

<!-- Policy Detail Modal -->
<div
  *ngIf="selectedPolicy"
  class="lux-modal-root"
  (click)="closePolicyDetail()"
  role="dialog"
  aria-modal="true">
  <div class="lux-modal-backdrop"></div>
  <div class="lux-modal-panel" (click)="$event.stopPropagation()">
    <header class="lux-modal-header">
      <div>
        <p class="lux-overline">Policy</p>
        <h2 class="lux-h2">{{ selectedPolicy.title }}</h2>
      </div>
      <lux-button type="button" variant="ghost" (pressed)="closePolicyDetail()">Close</lux-button>
    </header>
    <div class="lux-modal-body policy-content-full" [innerHTML]="selectedPolicy.content"></div>
    <footer class="lux-modal-footer">
      <lux-button type="button" variant="primary" (pressed)="editPolicy(selectedPolicy)">Edit Policy</lux-button>
      <lux-button type="button" variant="secondary" (pressed)="closePolicyDetail()">Close</lux-button>
    </footer>
  </div>
</div>
