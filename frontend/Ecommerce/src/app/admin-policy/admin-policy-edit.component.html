<lux-page-shell variant="admin">
  <lux-page-header
    variant="admin"
    eyebrow="Settings"
    title="Edit Policy"
    subtitle="Update policy title, status, and content.">
    <lux-button actions type="button" variant="secondary" (pressed)="cancelEdit()">Back to list</lux-button>
  </lux-page-header>

  <div *ngIf="loading && !policy" class="lux-loading-block">
    <lux-skeleton width="100%" height="16rem"></lux-skeleton>
  </div>

  <lux-card *ngIf="!loading || policy" eyebrow="Policy" title="Policy information">
    <form [formGroup]="policyForm" (ngSubmit)="submitForm()" class="lux-settings-form">
      <div class="lux-settings-grid">
        <lux-field
          label="Policy title"
          inputId="title"
          [error]="policyForm.get('title')?.invalid && policyForm.get('title')?.touched ? 'Policy title is required' : ''">
          <input
            type="text"
            id="title"
            class="lux-input"
            formControlName="title"
            placeholder="Enter policy title" />
        </lux-field>

        <lux-field label="Status" inputId="status">
          <select id="status" class="lux-select" formControlName="status">
            <option value="1">Active</option>
            <option value="0">Inactive</option>
          </select>
        </lux-field>
      </div>

      <lux-field
        label="Policy content"
        inputId="content"
        [error]="policyForm.get('content')?.invalid && policyForm.get('content')?.touched ? 'Policy content is required' : ''">
        <div class="lux-quill-shell">
          <quill-editor
            formControlName="content"
            [modules]="quillModules"
            theme="snow"
            placeholder="Enter policy content..."
            class="quill-editor-fixed">
          </quill-editor>
        </div>
      </lux-field>

      <div class="lux-settings-actions">
        <lux-button type="button" variant="secondary" (pressed)="cancelEdit()">Cancel</lux-button>
        <lux-button
          type="submit"
          variant="primary"
          [disabled]="policyForm.invalid"
          [loading]="loading && !!policy">
          {{ loading ? 'Updating…' : 'Update Policy' }}
        </lux-button>
      </div>
    </form>
  </lux-card>
</lux-page-shell>
