<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-4xl mx-auto">
    
    <!-- Header Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 glassmorphism rounded-2xl shadow-lg mb-4">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Edit Policy</h1>
      <p class="text-gray-600">Update policy information</p>
    </div>

    <!-- Loading State -->
    <div *ngIf="loading && !policy" class="flex items-center justify-center py-12">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-blue-100 mb-4">
        <svg class="w-6 h-6 text-blue-600 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>
    </div>

    <!-- Main Form Card -->
    <div *ngIf="!loading || policy" class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
      
      <!-- Form Header -->
      <div class="px-6 py-4 border-b border-gray-200 bg-gray-50">
        <div class="flex items-center space-x-2">
          <div class="w-5 h-5 bg-blue-100 rounded-full flex items-center justify-center">
            <svg class="w-3 h-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <h2 class="text-lg font-semibold text-gray-900">Policy Information</h2>
        </div>
      </div>

      <!-- Form Content -->
      <div class="p-6">
        <form [formGroup]="policyForm" (ngSubmit)="submitForm()" class="space-y-6">
          
          <!-- Two Column Layout -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Left Column -->
            <div class="space-y-6">
              
              <!-- Policy Title -->
              <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">
                  <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
                    </svg>
                    <span>Policy Title</span>
                  </div>
                </label>
                <input 
                  type="text" 
                  id="title"
                  formControlName="title" 
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                  placeholder="Enter policy title"
                  [class.border-red-300]="policyForm.get('title')?.invalid && policyForm.get('title')?.touched"
                />
                <div *ngIf="policyForm.get('title')?.invalid && policyForm.get('title')?.touched" class="mt-1 text-sm text-red-600">
                  Policy title is required
                </div>
              </div>

              <!-- Policy Status -->
              <div>
                <label for="status" class="block text-sm font-medium text-gray-700 mb-2">
                  <div class="flex items-center space-x-2">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                    <span>Status</span>
                  </div>
                </label>
                <select 
                  id="status"
                  formControlName="status"
                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors bg-white custom-select"
                >
                  <option value="1">Active</option>
                  <option value="0">Inactive</option>
                </select>
              </div>

            </div>

            <!-- Right Column - Empty for balance -->
            <div class="space-y-6">
              <!-- This column is intentionally left empty to maintain layout balance -->
            </div>

          </div>

          <!-- Full Width Content Field -->
          <div>
            <label for="content" class="block text-sm font-medium text-gray-700 mb-2">
              <div class="flex items-center space-x-2">
                <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                </svg>
                <span>Policy Content</span>
              </div>
            </label>
            
            <!-- Fixed Size Quill Editor Container -->
            <div class="w-full border border-blue-300 rounded-lg overflow-hidden bg-white shadow-sm" style="height: 400px;">
              <quill-editor 
                formControlName="content" 
                [modules]="quillModules"
                theme="snow"
                placeholder="Enter policy content..."
                class="quill-editor-fixed"
                style="height: 100%; width: 100%;">
              </quill-editor>
            </div>
            
            <div *ngIf="policyForm.get('content')?.invalid && policyForm.get('content')?.touched" class="mt-1 text-sm text-red-600">
              Policy content is required
            </div>
          </div>

          <!-- Form Actions -->
          <div class="flex items-center justify-end space-x-4 pt-6 border-t border-gray-200">
            <button 
              type="button"
              (click)="cancelEdit()"
              class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors font-medium">
              Cancel
            </button>
            <button 
              type="submit"
              [disabled]="policyForm.invalid || loading"
              class="px-6 py-2.5 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors font-medium flex items-center space-x-2">
              <svg *ngIf="loading" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>{{ loading ? 'Updating...' : 'Update Policy' }}</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
