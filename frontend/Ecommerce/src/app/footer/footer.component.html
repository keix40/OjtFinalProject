<!-- Footer -->
<footer class="bg-espresso text-ivory py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-5 gap-12">
            <!-- Company Information -->
            <div class="md:col-span-2">
                <p class="lux-overline mb-3" style="color: var(--lux-champagne-soft);">Britium Gallery</p>
                <h3 class="lux-h2 mb-6" style="color: #F7F3EC; font-size: 2rem;">
                    {{ companyName }}
                </h3>
                <p class="lux-body mb-8" style="color: var(--lux-fog);">
                    {{ companyDescription }}
                </p>
                <div class="flex space-x-3">
                    <a *ngFor="let social of socialMediaLinks"
                       [href]="social.url"
                       target="_blank"
                       class="w-10 h-10 border border-fog/40 flex items-center justify-center hover:border-champagne hover:text-champagne transition-all duration-lux"
                       rel="noopener">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                            <path [attr.d]="social.icon"></path>
                        </svg>
                    </a>
                </div>
            </div>

            <div>
                <h4 class="lux-overline mb-6" style="color: var(--lux-champagne-soft);">Shop</h4>
                <ul class="space-y-3" style="color: var(--lux-fog);">
                    <li>
                        <a routerLink="/usercategorylist" class="lux-link hover:text-ivory transition-colors">
                            All Categories
                        </a>
                    </li>
                    <li *ngFor="let category of categories">
                        <a (click)="navigateToCategory(category)"
                           class="lux-link hover:text-ivory transition-colors cursor-pointer">
                            {{ category.name }}
                        </a>
                    </li>
                    <li *ngFor="let brand of brands">
                        <a (click)="navigateToBrand(brand)"
                           class="lux-link hover:text-ivory transition-colors cursor-pointer">
                            {{ brand.name }}
                        </a>
                    </li>
                    <li *ngIf="loading" class="lux-body-sm">Loading…</li>
                </ul>
            </div>

            <div>
                <h4 class="lux-overline mb-6" style="color: var(--lux-champagne-soft);">Support</h4>
                <ul class="space-y-3" style="color: var(--lux-fog);">
                    <li *ngFor="let link of supportLinks">
                        <a [routerLink]="link.url" class="lux-link hover:text-ivory transition-colors">
                            {{ link.name }}
                        </a>
                    </li>
                </ul>
            </div>

            <div>
                <h4 class="lux-overline mb-6" style="color: var(--lux-champagne-soft);">Company</h4>
                <ul class="space-y-3" style="color: var(--lux-fog);">
                    <li *ngFor="let link of companyLinks">
                        <a [routerLink]="link.url" class="lux-link hover:text-ivory transition-colors">
                            {{ link.name }}
                        </a>
                    </li>
                </ul>
            </div>
        </div>

        <div class="border-t border-fog/30 mt-16 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="lux-body-sm" style="color: var(--lux-stone);">
                &copy; {{ currentYear }} {{ companyName }}. All rights reserved.
            </p>
            <div class="flex items-center space-x-4">
                <span class="lux-overline" style="color: var(--lux-stone);">We accept</span>
                <div class="flex space-x-2">
                    <span *ngFor="let payment of paymentMethods"
                          class="px-2.5 py-1 border border-fog/40 text-xs tracking-wider uppercase"
                          style="color: var(--lux-fog);">
                        {{ payment.code }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</footer>
