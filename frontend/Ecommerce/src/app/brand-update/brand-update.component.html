<div class="w-full max-w-2xl mx-auto">
  <div class="bg-gradient-to-r from-gray-800 to-gray-900 text-white rounded-t-lg p-6 border-b border-gray-700">
    <div class="flex items-center justify-between">
      <h5 class="text-xl font-bold">Update Brand</h5>
      <button type="button" (click)="activeModal.dismiss()" class="text-gray-300 hover:text-white rounded-full p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
  <form *ngIf="brand" #updateBrandForm="ngForm" (ngSubmit)="updateBrand(updateBrandForm)" class="bg-white p-6 space-y-6 rounded-b-lg">
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Brand Name</label>
      <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
        name="brandName" [(ngModel)]="brand.brandName" required />
    </div>
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Categories</label>
      <select
        multiple
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 min-h-[120px]"
        name="selectedCategoryIds"
        [(ngModel)]="selectedCategoryIds"
        required
      >
        <option *ngFor="let cat of categories" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
      <p class="text-xs text-gray-500 mt-1">Hold Ctrl (or Cmd on Mac) to select multiple categories</p>

      <div class="space-y-3">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Brand Image
        </label>
        <div class="relative">
          <input
            type="file"
            class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
            (change)="onImageSelected($event)"
            accept="image/*"
            id="imageInputUpdate"
          />
          <label for="imageInputUpdate" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-400 rounded-xl bg-blue-50 hover:bg-blue-100 transition-colors duration-200 cursor-pointer select-none text-center p-6">
            <svg class="h-14 w-14 text-blue-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
              <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="text-base font-medium text-blue-700">Click to upload or drag and drop</span>
            <span class="text-xs text-gray-500 mt-1">PNG, JPG, GIF up to 10MB</span>
          </label>
        </div>
      </div>
      <!-- Preview Image -->
      <div class="space-y-2" *ngIf="imagePreviewUrl">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
          Image Preview
        </label>
        <div class="relative inline-block">
          <img 
            [src]="imagePreviewUrl" 
            alt="Preview" 
            class="max-w-[120px] max-h-[90px] rounded-lg shadow-md border border-gray-200 object-contain" 
          />
          <button 
            type="button"
            class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600 transition-colors duration-200"
            (click)="removeImage()"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      
    </div>
    <div class="flex justify-end gap-2">
      <button type="button" (click)="activeModal.dismiss()" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300">Cancel</button>
      <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Update</button>
    </div>
  </form>
  <div *ngIf="loading" class="p-6 text-center text-gray-500">Loading...</div>
</div>
