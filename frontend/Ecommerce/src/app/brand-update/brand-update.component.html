<div class="admin-modal admin-modal--lg relative">
  <button type="button" class="admin-modal-close" (click)="activeModal.dismiss()" aria-label="Close">&times;</button>
  <div class="admin-modal__header">
    <h5 class="admin-modal__title">Update Brand</h5>
  </div>
  <form *ngIf="brand" #updateBrandForm="ngForm" (ngSubmit)="updateBrand(updateBrandForm)">
    <div class="admin-modal__body space-y-6">
      <div class="space-y-2">
        <label class="lux-field-label">Brand Name</label>
        <input type="text" class="lux-input" name="brandName" [(ngModel)]="brand.brandName" required />
      </div>
      <div class="space-y-2">
        <label class="lux-field-label">Categories</label>
        <select
          multiple
          class="lux-select admin-multiselect"
          name="selectedCategoryIds"
          [(ngModel)]="selectedCategoryIds"
          required
        >
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
        </select>
        <p class="lux-field-hint">Hold Ctrl (or Cmd on Mac) to select multiple categories</p>
      </div>
      <div class="space-y-3">
        <label class="lux-field-label">Brand Image</label>
        <div class="admin-upload">
          <input type="file" class="admin-upload__input" (change)="onImageSelected($event)" accept="image/*" id="imageInputUpdate" />
          <label for="imageInputUpdate" class="admin-upload__label">Click to upload or drag and drop · PNG, JPG, GIF up to 10MB</label>
        </div>
        <div class="space-y-2" *ngIf="imagePreviewUrl">
          <label class="lux-field-label">Image Preview</label>
          <div class="relative inline-block">
            <img [src]="imagePreviewUrl" alt="Preview" class="admin-preview-img" />
            <button type="button" class="admin-preview-remove" (click)="removeImage()" aria-label="Remove image">×</button>
          </div>
        </div>
      </div>
    </div>
    <div class="admin-modal__footer">
      <button type="button" class="lux-btn lux-btn--ghost" (click)="activeModal.dismiss()">Cancel</button>
      <button
        type="submit"
        class="lux-btn lux-btn--primary"
        [disabled]="!permissionService.hasPermission(PermissionConstants.BRANDS_UPDATE)"
      >
        Update
      </button>
    </div>
  </form>
  <div *ngIf="loading" class="admin-modal__body admin-empty">Loading…</div>
</div>
