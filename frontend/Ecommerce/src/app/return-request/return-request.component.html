<div class="lux-overlay return-overlay">
  <div class="lux-dialog" role="dialog" aria-modal="true">
    <button type="button" class="lux-dialog__close" (click)="closeModal()" aria-label="Close">&times;</button>
    <header class="lux-dialog__head">
      <p class="lux-overline">Aftercare</p>
      <h2>Return request</h2>
    </header>

    <form (ngSubmit)="onSubmit()" #returnForm="ngForm" class="lux-dialog__body form-stack">
      <lux-field label="Order code" inputId="orderCode">
        <input id="orderCode" name="orderCode" type="text" class="lux-input" [value]="orderCode" readonly />
      </lux-field>

      <lux-field label="Products" inputId="product">
        <select id="product" name="product" class="lux-select" [(ngModel)]="selectedProducts" multiple required>
          <option *ngFor="let product of products" [ngValue]="product">
            {{ product.productName }}
          </option>
        </select>
      </lux-field>

      <p *ngIf="selectedProducts && selectedProducts.length > 0" class="selected-hint">
        Selected: {{ getSelectedProductNames() }}
      </p>

      <lux-field label="Reason for return" inputId="reason">
        <select id="reason" name="reason" class="lux-select" [(ngModel)]="reason" required>
          <option value="" disabled selected>Select a reason</option>
          <option value="WRONG_ITEM_DELIVERED">Wrong Item Delivered</option>
          <option value="DAMAGED_ON_ARRIVAL">Damaged on Arrival</option>
          <option value="CHANGED_MIND">Changed Mind</option>
        </select>
      </lux-field>

      <lux-field label="Return details" inputId="details">
        <textarea id="details" name="details" class="lux-input" rows="3" [(ngModel)]="details"></textarea>
      </lux-field>

      <div>
        <p class="lux-field-label">Upload image(s)</p>
        <input id="file" name="file" type="file" class="hidden" (change)="onFileChange($event)" multiple />
        <label for="file" class="lux-btn lux-btn--secondary upload-label">Choose files</label>
      </div>

      <div *ngIf="files.length > 0" class="preview-row">
        <div *ngFor="let url of previewUrls; let i = index" class="preview">
          <img [src]="url" alt="Preview" />
          <button type="button" (click)="removeFile(i)" aria-label="Remove">&times;</button>
        </div>
      </div>

      <lux-button type="submit" variant="primary" block [disabled]="!returnForm.form.valid">
        Submit request
      </lux-button>
    </form>
  </div>
</div>
