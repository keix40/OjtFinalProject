<div class="account-section">
  <div class="account-section-head">
    <div>
      <p class="lux-overline">Saved</p>
      <h2>Wishlist</h2>
      <p>Pieces held for another moment.</p>
    </div>
  </div>

  <lux-async-state
    [loading]="isLoading"
    [empty]="!isLoading && wishlistItems.length === 0"
    emptyEyebrow="Archive"
    emptyTitle="Your wishlist is empty"
    emptyMessage="Add pieces you want to revisit."
    skeletonCount="3"
    skeletonHeight="5rem"
  >
    <div empty-action>
      <a routerLink="/userproductlist" class="lux-btn lux-btn--primary">Continue shopping</a>
    </div>

    <p class="wish-count">{{ wishlistItems.length }} products</p>
    <div class="wish-list">
      <article *ngFor="let item of wishlistItems" class="account-list-item wish-row">
        <div class="wish-media">
          <img [src]="item.image" [alt]="item.title" (error)="imageService.handleImageError($event, 'product')" />
        </div>
        <div class="wish-body">
          <h3>{{ item.title }}</h3>
          <p class="price">
            <strong>{{ item.price }} MMK</strong>
            <del *ngIf="item.oldPrice">{{ item.oldPrice }}</del>
          </p>
          <small>Added {{ item.wishlistDate | date:'longDate' }}</small>
        </div>
        <div class="wish-actions">
          <lux-button variant="ghost" type="button" (pressed)="removeFromWishlist(item)">Remove</lux-button>
          <lux-button variant="primary" type="button" (pressed)="addToCart(item)">Add to bag</lux-button>
        </div>
      </article>
    </div>
  </lux-async-state>
</div>
