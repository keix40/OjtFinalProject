<div class="min-h-screen bg-gradient-to-br from-gray-50 via-white to-gray-50 p-6">
  <div class="max-w-6xl mx-auto">
    <!-- Cool Header with Animated Elements -->
    <div class="relative mb-8">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-4">
          <div class="relative">
            <div class="w-3 h-12 bg-gradient-to-b from-blue-500 via-purple-500 to-pink-500 rounded-full animate-pulse"></div>
            <div class="absolute -top-1 -right-1 w-2 h-2 bg-green-400 rounded-full animate-bounce"></div>
          </div>
          <div>
            <h1 class="text-3xl font-black bg-gradient-to-r from-gray-900 via-gray-700 to-gray-500 bg-clip-text text-transparent">
              Personal Profile
            </h1>
            <p class="text-sm text-gray-500 mt-1">Manage your account details</p>
          </div>
        </div>
        
        <!-- Cool Status Indicator -->
        <div class="flex items-center space-x-3">
          <div class="flex items-center space-x-2 px-4 py-2 bg-white/80 backdrop-blur-sm border border-gray-200 rounded-full">
            <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
            <span class="text-xs font-semibold text-gray-600">Active</span>
      </div>
          <button 
            class="group relative px-6 py-3 bg-white border-2 border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-lg transition-all duration-300 text-sm font-semibold overflow-hidden"
                  (click)="toggleEditMode()">
            <span class="relative z-10 flex items-center space-x-2">
              <svg class="w-4 h-4 group-hover:rotate-12 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
              </svg>
              <span>{{ isEditing ? 'Editing' : 'Edit Profile' }}</span>
            </span>
            <div class="absolute inset-0 bg-gradient-to-r from-blue-50 to-purple-50 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Profile Image Section -->
      <div class="lg:col-span-1">
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-white/20 p-8 text-center">
          <div class="relative inline-block">
            <!-- Profile Image -->
            <div class="relative w-48 h-48 mx-auto mb-6">
              <div class="w-full h-full rounded-full overflow-hidden bg-gradient-to-br from-gray-100 to-gray-200 border-4 border-white shadow-xl">
                <ng-container *ngIf="userDetails && userDetails.profileImage && userDetails.profileImage !== '/upload/defaultProfile.png'; else showDefaultIcon">
                  <img [src]="previewAvatarUrl || userDetails.profileImage"
                       alt="Profile Image"
                       class="w-full h-full object-cover">
                </ng-container>
                <ng-template #showDefaultIcon>
                  <div class="w-full h-full flex items-center justify-center">
                    <svg class="w-20 h-20 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                  </div>
                </ng-template>
              </div>
              
              <!-- Edit Overlay -->
              <div *ngIf="isEditing"
                   class="absolute inset-0 bg-black/60 backdrop-blur-sm rounded-full flex items-center justify-center cursor-pointer hover:bg-black/70 transition-all duration-300 group"
                   (click)="openEditAvatarModal()">
                <div class="text-center">
                  <svg class="w-8 h-8 text-white mb-2 group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                  </svg>
                  <p class="text-xs text-white font-medium">Change Photo</p>
                </div>
              </div>
            </div>

            <!-- Profile Stats -->
            <div class="space-y-4">
              <div class="flex items-center justify-center space-x-6">
                <div class="text-center">
                  <div class="text-2xl font-bold text-gray-800">Active</div>
                  <div class="text-xs text-gray-500">Status</div>
                </div>
                <div class="w-px h-8 bg-gray-200"></div>
                <div class="text-center">
                  <div class="text-2xl font-bold text-gray-800">Member</div>
                  <div class="text-xs text-gray-500">Type</div>
                </div>
              </div>

              <!-- Edit Button -->
              <button 
                *ngIf="isEditing"
                class="w-full mt-6 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1"
                (click)="openEditAvatarModal()">
                <span class="flex items-center justify-center space-x-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                  </svg>
                  <span>Update Photo</span>
                </span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Form Section -->
      <div class="lg:col-span-2">
        <div class="bg-white/80 backdrop-blur-sm rounded-2xl shadow-lg border border-white/20 overflow-hidden">
          <!-- Form Header -->
          <div class="px-8 py-6 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-white">
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-xl font-bold text-gray-800 mb-2">Personal Details</h2>
                <p class="text-sm text-gray-600">Update your personal information and preferences</p>
              </div>
              
            </div>
          </div>

          <!-- Form Content -->
          <div class="p-8">
            <form [formGroup]="personalInfoForm" class="space-y-6">
              <!-- Hidden User ID -->
              <div class="hidden">
                <input type="text" [value]="userDetails?.id || ''" disabled>
              </div>

              <!-- Form Fields Grid -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Full Name -->
                <div class="space-y-2">
                  <label class="text-sm font-semibold text-gray-700 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Full Name</span>
                  </label>
                  <input 
                    type="text" 
                    class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 disabled:bg-gray-50 disabled:text-gray-500 hover:border-gray-300"
                    formControlName="name" 
                    placeholder="Enter your full name">
                </div>

                <!-- Email -->
                <div class="space-y-2">
                  <label class="text-sm font-semibold text-gray-700 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <span>Email Address</span>
                  </label>
                  <input 
                    type="email" 
                    class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 disabled:bg-gray-50 disabled:text-gray-500 hover:border-gray-300"
                    formControlName="email" 
                    placeholder="Enter your email">
                </div>

                <!-- Gender -->
                <div class="space-y-2">
                  <label class="text-sm font-semibold text-gray-700 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Gender</span>
                  </label>
                  <select 
                    class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-300 disabled:bg-gray-50 disabled:text-gray-500 hover:border-gray-300"
                    formControlName="gender">
                    <option value="">Select Gender</option>
                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>
                    <option value="OTHER">Other</option>
                  </select>
                </div>

                <!-- Date of Birth -->
                <div class="space-y-2">
                  <label class="text-sm font-semibold text-gray-700 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span>Date of Birth</span>
                  </label>
                  <input 
                    type="date" 
                    class="w-full px-4 py-3 text-sm border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-transparent transition-all duration-300 disabled:bg-gray-50 disabled:text-gray-500 hover:border-gray-300"
                    formControlName="dateOfBirth" 
                    placeholder="Enter your date of birth">
                </div>

                <!-- Phone Number -->
                <div class="space-y-2 md:col-span-2">
                  <label class="text-sm font-semibold text-gray-700 flex items-center space-x-2">
                    <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                    <span>Phone Number</span>
                  </label>
                  <input
                    type="text"
                    class="w-full px-4 py-3 text-sm border rounded-xl focus:ring-2 focus:border-transparent transition-all duration-300 disabled:bg-gray-50 disabled:text-gray-500 hover:border-gray-300"
                    [ngClass]="{
                      'border-red-300 focus:ring-red-500': isPhoneEmpty(),
                      'border-yellow-300 focus:ring-yellow-500': isPhoneUnverified(),
                      'border-gray-200 focus:ring-red-500': !isPhoneEmpty() && !isPhoneUnverified()
                    }"
                    formControlName="phoneNumber" 
                    placeholder="Enter your phone number">
                  
                  <!-- Validation Messages -->
                  <div *ngIf="isPhoneEmpty()" class="flex items-center space-x-2 text-xs text-red-500 mt-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span>Phone number is empty.</span>
                  </div>
                  <div *ngIf="isPhoneUnverified()" class="flex items-center space-x-2 text-xs text-yellow-600 mt-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                    </svg>
                    <span>Phone number isn't verified yet.</span>
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div *ngIf="isEditing" class="flex items-center space-x-4 pt-6 border-t border-gray-100">
                <button 
                  type="button" 
                  class="flex items-center space-x-3 px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1"
                  (click)="saveChanges()">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                  </svg>
                  <span>Save Changes</span>
                </button>
                <button 
                  type="button" 
                  class="flex items-center space-x-3 px-8 py-3 bg-gray-100 text-gray-700 font-semibold rounded-xl hover:bg-gray-200 transition-all duration-300"
                  (click)="cancelEdit()">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                  </svg>
                  <span>Cancel</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Avatar Edit Options Modal -->
<div class="modal fade" id="editAvatarModal" tabindex="-1" aria-labelledby="editAvatarModalLabel" aria-hidden="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="editAvatarModalLabel">Profile Avatar Options</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body d-flex flex-column gap-3">
        <!-- Hidden File Input -->
        <input type="file" #fileInput accept="image/*" hidden (change)="onFileSelected($event)">
        <button class="btn btn-primary w-100" (click)="triggerFileInput(fileInput)" type="button">
          Edit Profile Avatar
        </button>
        <button class="btn btn-outline-secondary w-100" (click)="onViewProfile()" type="button">
          View Profile Avatar
        </button>
        <button class="btn btn-light text-danger w-100" data-bs-dismiss="modal" type="button">
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
