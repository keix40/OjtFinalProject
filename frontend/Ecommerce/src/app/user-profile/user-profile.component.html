        <i class="bi bi-person"></i>

      <button class="flex items-center gap-2 px-2 py-2 rounded-xl text-xs font-medium transition-colors duration-200 whitespace-nowrap hover:bg-blue-50 hover:text-blue-700 focus:outline-none"

        Orders

      </button>

<!-- Main Content -->
<main class="main-content">
  <div class="content-container">
      <div class="content-card">

          <!-- Personal Info Section -->
          <div *ngIf="activeSection === 'personal-info'" class="content-section">
            <app-user-personal-info [userDetails]="userDetails"></app-user-personal-info>
          </div>

          <!-- Orders Section -->
          <div *ngIf="activeSection === 'orders'" class="content-section">
              <app-user-orders></app-user-orders>
          </div>
          
          <!-- Wishlist Section -->
          <div *ngIf="activeSection === 'wishlist'" class="content-section">
              <app-user-wishlist></app-user-wishlist>
          </div>
          
          <!-- Payment Methods Section -->
          <div *ngIf="activeSection === 'payment'" class="content-section">
              <app-user-payment-methods></app-user-payment-methods>
          </div>
          
          <!-- My Reviews Section -->
          <div *ngIf="activeSection === 'reviews'" class="content-section">
              <app-user-reviews></app-user-reviews>
          </div>
                    
          <!-- Addresses Section -->
          <div *ngIf="activeSection === 'addresses'" class="content-section">
              <app-user-addresses></app-user-addresses>
          </div>
          
          <!-- Notifications Section -->
          <div *ngIf="activeSection === 'notifications'" class="content-section">
              <app-user-notifications></app-user-notifications>
          </div>

          <!-- Coupons Section -->
          <div *ngIf="activeSection === 'coupons'" class="content-section">
              <app-user-coupon-list></app-user-coupon-list>
          </div>

          <!-- Help Center Section -->
          <div *ngIf="activeSection === 'help'" class="content-section">
              <!-- <app-help-center></app-help-center> -->
          </div>

          <!-- Terms Section -->
          <div *ngIf="activeSection === 'terms'" class="content-section">
              <!-- <app-terms-conditions></app-terms-conditions> -->
          </div>
      </div>
  </div>
</main>
<app-footer></app-footer>
