<app-header></app-header>
<main class="customer-account account-maison">
  <div class="account-shell">
    <lux-page-header
      eyebrow="Private client services"
      title="Your account"
      subtitle="Manage your personal details, orders and preferences in one considered space."
    ></lux-page-header>

    <lux-tabs
      class="account-tabs"
      [tabs]="accountTabs"
      [activeId]="activeSection"
      (activeIdChange)="selectSection($event)"
    ></lux-tabs>

    <section class="account-content">
      <div *ngIf="activeSection === 'personal-info'">
        <app-user-personal-info [userDetails]="userDetails" [vipTierInfo]="vipTierInfo"></app-user-personal-info>
      </div>
      <div *ngIf="activeSection === 'orders'">
        <app-user-orders></app-user-orders>
      </div>
      <div *ngIf="activeSection === 'wishlist'">
        <app-user-wishlist></app-user-wishlist>
      </div>
      <div *ngIf="activeSection === 'payment'">
        <app-user-payment-methods></app-user-payment-methods>
      </div>
      <div *ngIf="activeSection === 'reviews'">
        <app-user-reviews></app-user-reviews>
      </div>
      <div *ngIf="activeSection === 'addresses'">
        <app-user-addresses></app-user-addresses>
      </div>
      <div *ngIf="activeSection === 'notifications'">
        <app-user-notifications></app-user-notifications>
      </div>
      <div *ngIf="activeSection === 'coupons'">
        <app-user-coupon-list></app-user-coupon-list>
      </div>
    </section>
  </div>
</main>
<app-footer></app-footer>
