<div class="account-section">
  <div class="account-section-head">
    <div>
      <p class="lux-overline">Alerts</p>
      <h2>Notifications</h2>
      <p>Stay updated with your latest activity.</p>
    </div>
    <div class="notif-toolbar">
      <lux-button
        *ngIf="multiSelectMode"
        variant="ghost"
        type="button"
        [disabled]="selectedIds.size === 0"
        (pressed)="deleteSelectedNotifications()"
      >Delete</lux-button>
      <lux-button
        variant="secondary"
        type="button"
        [disabled]="getUnreadCount() === 0"
        (pressed)="markAllAsRead()"
      >Mark all read</lux-button>
      <lux-button variant="ghost" type="button" (pressed)="toggleMultiSelectMode()">
        {{ multiSelectMode ? 'Cancel' : 'Select' }}
      </lux-button>
    </div>
  </div>

  <lux-empty-state
    *ngIf="notifications.length === 0"
    eyebrow="Inbox"
    title="No notifications yet"
    message="You are all caught up. New notices will appear here."
  ></lux-empty-state>

  <div *ngIf="notifications.length > 0" class="notif-list">
    <article
      *ngFor="let notif of notifications"
      class="account-list-item notif-row"
      [class.is-unread]="!notif.read"
      (click)="onNotificationClick(notif)"
    >
      <label *ngIf="multiSelectMode" class="check" (click)="$event.stopPropagation()">
        <input type="checkbox" [checked]="isSelected(notif.id)" (click)="toggleSelect(notif.id, $event)" />
      </label>
      <div class="notif-icon" [class.is-discount]="notif.type === 'discount'">
        <span *ngIf="notif.type === 'discount'" class="material-icons">percent</span>
        <span *ngIf="notif.type !== 'discount'" aria-hidden="true">•</span>
      </div>
      <div class="notif-body">
        <p>
          <span *ngIf="notif.type === 'discount'" class="status-pill">Discount</span>
          {{ notif.message }}
        </p>
        <small>{{ notif.formattedTimestamp }} <span *ngIf="!notif.read" class="status-pill status-pill--info">New</span></small>
      </div>
      <div class="notif-menu" (click)="$event.stopPropagation()">
        <button type="button" class="menu-btn" (click)="toggleMenu(notif, $event)" aria-label="More options">⋮</button>
        <div *ngIf="notif.showMenu" class="menu-pop">
          <button type="button" (click)="notif.read ? markAsUnread(notif) : markAsRead(notif)">
            {{ notif.read ? 'Mark unread' : 'Mark read' }}
          </button>
          <button type="button" class="danger" (click)="deleteNotification(notif.id, $event)">Delete</button>
        </div>
      </div>
    </article>
  </div>

  <p *ngIf="notifications.length > 0" class="notif-foot">
    {{ notifications.length }} total · {{ getUnreadCount() }} unread
  </p>
</div>
