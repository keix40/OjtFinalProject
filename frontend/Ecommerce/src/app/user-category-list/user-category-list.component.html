<app-header></app-header>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8n mt-8 mb-8">
  <div class="text-center mb-16">
    <h2 class="text-4xl lg:text-5xl font-bold text-neutral-900 mb-4 animate-slide-up">
      All <span class="text-primary-600">Categories</span>
    </h2>
  </div>
  <div *ngIf="loading" class="text-center text-lg">Loading categories...</div>
  <div *ngIf="error" class="text-center text-red-500">{{ error }}</div>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" *ngIf="!loading && !error">
    <div *ngFor="let cat of categories" class="category-card group relative overflow-hidden rounded-2xl bg-white hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 border border-neutral-200 animate-fade-in cursor-pointer" (click)="goToCategory(cat)">
      <div class="aspect-square overflow-hidden">
        <img [src]="getCategoryImageUrl(cat)" [alt]="cat.name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent group-hover:from-black/80 transition-all duration-300"></div>
      <div class="absolute top-4 left-4 w-12 h-12 bg-primary-600 rounded-xl flex items-center justify-center text-white text-xl group-hover:scale-110 transition-transform duration-300 animate-float">
        {{ cat.name ? cat.name[0] : '?' }}
      </div>
      <div class="absolute bottom-0 left-0 right-0 p-6 text-white">
        <h3 class="text-xl font-bold mb-1 group-hover:-translate-y-1 transition-transform duration-300">
          {{ cat.name }}
        </h3>
        <span *ngIf="cat.parentId" class="inline-block bg-white/30 text-xs px-2 py-1 rounded-full mt-1">
          Subcategory
        </span>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
