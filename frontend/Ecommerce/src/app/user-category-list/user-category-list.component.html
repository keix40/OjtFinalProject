<app-header></app-header>

<div class="customer-maison-page customer-breadcrumb">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <nav class="flex items-center space-x-2 text-sm" aria-label="Breadcrumb">
      <a routerLink="/home">Home</a>
      <span class="text-stone">/</span>
      <span class="lux-body-sm text-ink" aria-current="page">Collections</span>
    </nav>
  </div>
</div>

<main class="customer-maison-page pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <header class="maison-hero">
      <p class="lux-overline mb-3">Browse</p>
      <h1 class="lux-h1 mb-3">Collections</h1>
      <p class="lux-body max-w-2xl mx-auto">Curated chapters of the house, presented with quiet clarity.</p>
    </header>

    <lux-async-state
      [loading]="loading"
      [error]="error"
      [empty]="!categories.length"
      loadingLabel="Loading collections"
      skeletonHeight="16rem"
      emptyTitle="The next collection is being prepared"
      emptyMessage="Return soon for newly curated chapters."
      (retry)="loadCategories()"
    >
      <div class="maison-grid">
        <button
          type="button"
          *ngFor="let cat of categories"
          class="maison-tile"
          (click)="goToCategory(cat)"
        >
          <span class="maison-tile__media">
            <img [src]="getCategoryImageUrl(cat)" [alt]="cat.name" loading="lazy" />
          </span>
          <span class="maison-tile__body">
            <span class="lux-overline">Collection</span>
            <span class="lux-h3 block mt-1">{{ cat.name }}</span>
          </span>
        </button>
      </div>
    </lux-async-state>
  </div>
</main>

<app-footer></app-footer>
