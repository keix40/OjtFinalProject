<div class="max-w-md mx-auto p-6 bg-white rounded shadow">
  <h2 class="text-xl font-bold mb-4">Set Revenue Target</h2>
  <form (ngSubmit)="setTarget()">
    <div class="mb-3">
      <label class="block mb-1 font-medium">Period Type</label>
      <select [(ngModel)]="periodType" name="periodType" class="w-full border rounded p-2" (change)="onPeriodTypeChange()">
        <option value="day">Day</option>
        <option value="week">Week</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="block mb-1 font-medium">Period Value</label>
      <input [(ngModel)]="periodValue" name="periodValue" class="w-full border rounded p-2" placeholder="e.g. 2024-07-18, 2024-W29, 2024-07, 2024" required />
    </div>
    <div class="mb-3">
      <label class="block mb-1 font-medium">Target Amount</label>
      <input type="number" [(ngModel)]="targetAmount" name="targetAmount" class="w-full border rounded p-2" required />
    </div>
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Set Target</button>
  </form>
  <div *ngIf="message" class="mt-3 text-green-600">{{ message }}</div>
</div>
