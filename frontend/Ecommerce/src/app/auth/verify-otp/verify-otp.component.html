<lux-auth-shell
  brand="Britium Gallery"
  tagline="Curated luxury, quietly."
  imageUrl="assets/images/login-bg.jpg"
>
  <div class="text-center mb-10">
    <img src="/assets/images/britium-logo.png" alt="Britium Gallery" class="mx-auto mb-5 h-12 w-auto opacity-90" />
    <p class="lux-overline mb-3">Verification</p>
    <h1 class="lux-h1 mb-2" style="font-size: 2rem;">Verify your account</h1>
    <p class="lux-body-sm">We've sent a 6-digit code to</p>
    <p class="lux-body mt-1 font-medium text-ink">{{ email }}</p>
  </div>

  <div *ngIf="error" class="lux-field-error mb-4 p-3 border border-fog bg-cream animate-shake">
    {{ error }}
  </div>
  <div *ngIf="message" class="lux-body-sm mb-4 p-3 border border-fog bg-cream" style="color: var(--lux-success);">
    {{ message }}
  </div>

  <div class="flex justify-center gap-2 sm:gap-3 mb-8">
    <input
      *ngFor="let box of [0,1,2,3,4,5]; let i = index"
      maxlength="1"
      type="text"
      class="otp-box"
      [class.otp-box--error]="errorAnimation"
      [class.otp-box--success]="successAnimation[i]"
      [(ngModel)]="otpBoxes[i]"
      (input)="onOtpInput(i, $event)"
      (keydown)="onOtpKeydown(i, $event)"
      autocomplete="one-time-code"
      [disabled]="isVerifying"
      [attr.aria-label]="'OTP digit ' + (i + 1)"
    />
  </div>

  <p class="text-center lux-body-sm">
    Didn't receive a code?
    <a
      href="#"
      (click)="sendOtp(); $event.preventDefault();"
      class="lux-link ml-1 font-medium text-ink"
      [class.opacity-50]="isSending"
      [class.pointer-events-none]="isSending"
    >
      {{ isSending ? 'Sending…' : 'Resend' }}
    </a>
  </p>

  <p class="text-center mt-8 lux-body-sm">
    <a routerLink="/login" class="lux-link">Back to sign in</a>
  </p>
</lux-auth-shell>

<!-- CAPTCHA Modal -->
<div *ngIf="showCaptchaModal" class="fixed inset-0 flex items-center justify-center z-50 p-4">
  <div class="absolute inset-0 bg-ink/40 backdrop-blur-sm"></div>
  <div class="relative lux-glass w-full max-w-md mx-4 p-8 shadow-lux-lg">
    <button
      type="button"
      class="absolute top-6 right-6 text-stone hover:text-ink text-2xl leading-none"
      (click)="showCaptchaModal = false"
      aria-label="Close"
    >&times;</button>

    <div class="text-center mb-8">
      <p class="lux-overline mb-2">Security</p>
      <h4 class="lux-h2 mb-2" style="font-size: 1.75rem;">Verification</h4>
      <p class="lux-body-sm">Please complete this check to continue</p>
    </div>

    <div class="border border-fog bg-cream p-6 mb-6 text-center">
      <div class="lux-overline mb-3">Question</div>
      <div class="lux-h3">{{ captchaQuestion }}</div>
    </div>

    <div class="mb-6">
      <label class="lux-field-label">Your answer</label>
      <input
        type="text"
        [(ngModel)]="captchaInput"
        placeholder="Enter your answer"
        class="lux-input text-center"
        (keyup.enter)="verifyCaptcha()"
        [disabled]="isVerifyingCaptcha"
      />
    </div>

    <div *ngIf="captchaError" class="lux-field-error mb-4">{{ captchaError }}</div>

    <button
      type="button"
      class="lux-btn lux-btn--primary w-full"
      (click)="verifyCaptcha()"
      [disabled]="isVerifyingCaptcha || !captchaInput.trim()"
    >
      {{ isVerifyingCaptcha ? 'Verifying…' : 'Verify answer' }}
    </button>

    <div class="text-center mt-4">
      <button
        type="button"
        class="lux-link lux-body-sm"
        (click)="generateCaptcha()"
        [disabled]="isVerifyingCaptcha"
      >
        New question
      </button>
    </div>
  </div>
</div>
