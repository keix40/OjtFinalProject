<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4 relative">
  <div class="absolute -top-20 -left-20 w-40 h-40 bg-blue-400 bg-opacity-20 rounded-full filter blur-xl"></div>
  <div class="absolute -bottom-20 -right-20 w-40 h-40 bg-purple-400 bg-opacity-20 rounded-full filter blur-xl"></div>
  <div class="relative max-w-md w-full">
    <div class="bg-white bg-opacity-20 backdrop-filter backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden p-8">
      <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-gray-800">Verify Your Account</h1>
        <p class="text-gray-600 mt-2">We've sent a 6-digit code to your email</p>
        <p class="font-medium text-gray-700">{{ email }}</p>
      </div>

      <!-- Error/Message -->
      <div *ngIf="error" class="flex items-center gap-2 text-red-500 bg-red-50 border border-red-200 rounded p-2 mb-3 animate-shake">
        <i data-lucide="alert-circle" class="w-5 h-5"></i>
        <span>{{ error }}</span>
      </div>
      <div *ngIf="message" class="flex items-center gap-2 text-green-600 bg-green-50 border border-green-200 rounded p-2 mb-3">
        <i data-lucide="check-circle" class="w-5 h-5"></i>
        <span>{{ message }}</span>
      </div>

      <!-- OTP Boxes -->
      <div class="flex justify-center space-x-3 mb-8">
        <input *ngFor="let box of [0,1,2,3,4,5]; let i = index" maxlength="1" type="text"
          class="w-14 h-14 bg-white bg-opacity-70 border border-gray-200 rounded-lg flex items-center justify-center text-2xl font-semibold text-gray-800 shadow-sm text-center focus:ring-2 focus:ring-blue-500 outline-none transition-all
            [successAnimation[i]]
            [errorAnimation ? 'border-red-500' : '']"
          [(ngModel)]="otpBoxes[i]"
          (input)="onOtpInput(i, $event)"
          (keydown)="onOtpKeydown(i, $event)"
          autocomplete="one-time-code"
          [disabled]="isVerifying"
        />
      </div>

      <!-- Resend Code Link -->
      <div class="text-center mt-6">
        <p class="text-gray-600">Didn't receive a code?
          <a href="#" (click)="sendOtp(); $event.preventDefault();" class="text-blue-600 font-medium hover:text-blue-700" [class.opacity-50]="isSending" [class.pointer-events-none]="isSending">
            Resend
          </a>
        </p>
      </div>
    </div>
  </div>
</div>

<!-- CAPTCHA Modal -->
<div *ngIf="showCaptchaModal" class="fixed inset-0 flex items-center justify-center z-50 p-4">
  <div class="absolute inset-0 backdrop-blur-sm bg-black/40"></div>
  <div class="relative bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl shadow-xl overflow-hidden p-8 max-w-md w-full border border-white/30">
    <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-white/5 rounded-2xl"></div>
    <div class="relative z-10">
      <!-- Header -->
      <div class="text-center mb-6">
        <h4 class="text-2xl font-bold text-gray-800 mb-2">Security Check</h4>
        <p class="text-gray-600 text-sm">Please complete this verification to continue</p>
      </div>

      <!-- Close Button -->
      <button 
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl transition-colors" 
        (click)="showCaptchaModal = false"
      >
        &times;
      </button>

      <!-- CAPTCHA Question -->
      <div class="bg-white bg-opacity-70 border border-gray-200 rounded-lg p-4 mb-6 text-center">
        <div class="text-lg font-semibold text-gray-800 mb-2">Question:</div>
        <div class="text-2xl font-bold text-blue-600">{{ captchaQuestion }}</div>
      </div>

      <!-- Answer Input -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Your Answer</label>
        <input 
          type="text" 
          [(ngModel)]="captchaInput" 
          placeholder="Enter your answer" 
          class="w-full px-4 py-3 bg-white bg-opacity-70 border border-gray-200 rounded-lg text-gray-800 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 text-lg text-center font-semibold"
          (keyup.enter)="verifyCaptcha()"
          [disabled]="isVerifyingCaptcha"
        />
      </div>

      <!-- Error Message -->
      <div *ngIf="captchaError" class="flex items-center gap-2 text-red-500 bg-red-50 border border-red-200 rounded-lg p-3 mb-4 animate-shake">
        <i data-lucide="alert-circle" class="w-5 h-5"></i>
        <span class="text-sm">{{ captchaError }}</span>
      </div>

      <!-- Verify Button -->
      <button 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none" 
        (click)="verifyCaptcha()" 
        [disabled]="isVerifyingCaptcha || !captchaInput.trim()"
      >
        <div class="flex items-center justify-center gap-2">
          <span *ngIf="!isVerifyingCaptcha">Verify Answer</span>
          <span *ngIf="isVerifyingCaptcha">Verifying...</span>
          <i *ngIf="isVerifyingCaptcha" data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
        </div>
      </button>

      <!-- Refresh CAPTCHA -->
      <div class="text-center mt-4">
        <button 
          class="text-blue-600 hover:text-blue-700 text-sm font-medium transition-colors" 
          (click)="generateCaptcha()"
          [disabled]="isVerifyingCaptcha"
        >
          <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-1"></i>
          New Question
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  .animate-shake {
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  .border-success {
    border-color: #22c55e !important;
    box-shadow: 0 0 0 2px #22c55e33;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
</style>
