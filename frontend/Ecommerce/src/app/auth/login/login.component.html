<div class="body">
  <div class="card bold-form">
    <div class="card-header form-header text-center">
      <h2 class="mb-0">LOGIN</h2>
    </div>
    <div class="card-body form-body">
      <!-- ✅ Angular Reactive Form -->
      <form [formGroup]="loginForm" (ngSubmit)="submitLogin()">
        <div class="mb-3 position-relative">
          <label for="email" class="form-label fw-bold text-uppercase">Email</label>
          <input type="email" class="form-control" id="email" name="email" formControlName="email" required />
        </div>

        <div class="mb-3 position-relative">
          <label for="password" class="form-label fw-bold text-uppercase">Password</label>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="password" name="password" formControlName="password" required />
          <span class="input-icon" (click)="togglePasswordVisibility()">
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </span>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />
            <label class="form-check-label fw-bold" for="remember">Remember me</label>
          </div>
          <button type="button" class="btn btn-bold" href-like (click)="openForgotModal()">Forgot Password?</button>
        </div>

        <!-- ✅ Button must be inside form with type="submit" -->
        <button type="submit" class="btn btn-bold w-100 mb-3">SIGN IN</button>

        <div class="text-center">
          <span class="fw-bold">Don't have an account?</span>
          <a routerLink="/register" class="form-link">Register</a>
        </div>
      </form>
    </div>
  </div>

<!-- Forgot Password Modal -->
<div *ngIf="showForgotPasswordModal" class="modal-backdrop">
  <div class="modal-box">
    <h4>Forgot Password</h4>
    <input type="email" [(ngModel)]="forgotEmail" (ngModelChange)="onForgotEmailChange()" placeholder="Enter your email" class="form-control" />
      <div *ngIf="submittedForgot && forgotEmailError" class="text-danger mt-1">
      {{ forgotEmailError }}
      </div>
    <div class="text-danger mt-1" *ngIf="forgotError">{{ forgotError }}</div>

    <button class="btn btn-primary mt-2" (click)="sendForgotPasswordOtp()" [disabled]="isSendingOtp">
      <span *ngIf="!isSendingOtp">Send OTP</span>
      <span *ngIf="isSendingOtp">Sending...</span>
    </button>
  </div>
</div>

<!-- OTP Modal -->
<div *ngIf="showOtpModal" class="modal-backdrop">
  <div class="modal-box">
    <h4>Enter OTP</h4>
    <input type="text" [(ngModel)]="enteredOtp" (ngModelChange)="onOtpChange()" placeholder="Enter OTP" class="form-control" />
    <div class="text-danger mt-1" *ngIf="submittedOtp && otpError">{{ otpError }}</div>
    <button class="btn btn-primary mt-2" (click)="verifyOtp()" [disabled]="isVerifyingOtp">
      <span *ngIf="!isVerifyingOtp">Verify OTP</span>
      <span *ngIf="isVerifyingOtp">Verifying...</span>
    </button>
  </div>
</div>

<!-- Reset Password Modal -->
<div *ngIf="showResetModal" class="modal-backdrop">
  <div class="modal-box">
    <h4>Reset Password</h4>
    <input type="password" [(ngModel)]="newPassword" placeholder="New Password" class="form-control mb-2" />
    <div class="error" *ngIf="resetPasswordError">{{ resetPasswordError }}</div>
    <input type="password" [(ngModel)]="confirmPassword" placeholder="Confirm Password" class="form-control mb-2" />
    <div class="error" *ngIf="resetConfirmPasswordError">{{ resetConfirmPasswordError }}</div>
    <div class="error" *ngIf="resetError">{{ resetError }}</div>
    <button class="btn btn-success" (click)="resetPassword()" [disabled]="isResettingPassword">
      <span *ngIf="!isResettingPassword">Reset Password</span>
      <span *ngIf="isResettingPassword">Resetting...</span>
    </button>
  </div>
</div>

<!-- CAPTCHA Modal -->
<div *ngIf="showCaptchaModal" class="modal-backdrop">
  <div class="modal-box">
    <h4>Security Check</h4>
    <div class="mb-2">{{ captchaQuestion }}</div>
    <input type="text" [(ngModel)]="captchaInput" placeholder="Answer" class="form-control" />
    <div class="text-danger mt-1" *ngIf="captchaError">{{ captchaError }}</div>
    <button class="btn btn-primary mt-2" (click)="verifyCaptcha()" [disabled]="isVerifyingCaptcha">
      <span *ngIf="!isVerifyingCaptcha">Verify</span>
      <span *ngIf="isVerifyingCaptcha">Verifying...</span>
    </button>
  </div>
</div>

  <!-- Password Toggle JS -->
  <script>
    document.querySelectorAll('.password-toggle').forEach(icon => {
      icon.addEventListener('click', function () {
        const input = this.parentElement.querySelector('input');
        if (input.type === 'password') {
          input.type = 'text';
          this.classList.remove('fa-eye');
          this.classList.add('fa-eye-slash');
        } else {
          input.type = 'password';
          this.classList.remove('fa-eye-slash');
          this.classList.add('fa-eye');
        }
      });
    });
  </script>
</div>
