<app-header></app-header>
<main class="customer-account customer-post-purchase">
  <div class="post-shell review-shell">
    <lux-page-header
      eyebrow="Client voices"
      title="Product reviews"
      [subtitle]="reviews.length ? (getAverageRating() + ' average · ' + reviews.length + ' reviews') : 'What clients are saying about this piece.'"
    ></lux-page-header>

    <lux-empty-state
      *ngIf="!reviews.length"
      eyebrow="Reviews"
      title="No reviews yet"
      message="Be the first to share your experience with this product."
    ></lux-empty-state>

    <section *ngIf="reviews.length" class="post-panel review-panel">
      <article
        *ngFor="let review of reviews"
        class="review-item"
        (click)="markAsRead(review)"
      >
        <div class="avatar">
          <img *ngIf="review.userImage" [src]="getReviewUserImage(review)" [alt]="review.username" />
          <span *ngIf="!review.userImage" aria-hidden="true">{{ review.username?.charAt(0) || 'C' }}</span>
        </div>
        <div class="review-body">
          <div class="review-top">
            <h3>{{ review.username }}</h3>
            <span class="status-pill status-pill--ok">Verified</span>
          </div>
          <div class="stars" [attr.aria-label]="'Rating ' + review.rating + ' of 5'">
            <span *ngFor="let star of createArray(review.rating)" class="is-on">★</span>
            <span *ngFor="let empty of createArray(5 - review.rating)">★</span>
            <small>{{ review.rating }}/5</small>
          </div>
          <p>{{ review.comment }}</p>
          <div *ngIf="getAllMedia(review).length > 0" class="media-grid">
            <button
              *ngFor="let media of getAllMedia(review).slice(0, 4); let idx = index"
              type="button"
              class="media-thumb"
              (click)="openMediaModal(review, media.type, idx); $event.stopPropagation()"
            >
              <img *ngIf="media.type === 'image'" [src]="media.url" alt="" />
              <video *ngIf="media.type === 'video'" [src]="media.url"></video>
              <span *ngIf="idx === 3 && getAllMedia(review).length > 4" class="more">+{{ getAllMedia(review).length - 4 }}</span>
            </button>
          </div>
          <time>{{ review.timestamp | date:'MMM dd, yyyy' }}</time>
        </div>
        <div class="review-menu" (click)="$event.stopPropagation()">
          <button type="button" class="menu-btn" (click)="toggleMenu(review, $event)" aria-label="More options">⋮</button>
          <div *ngIf="review.showMenu" class="menu-pop">
            <button type="button" (click)="editReview(review)">Edit review</button>
            <button type="button" class="danger" (click)="confirmDeleteReview(review)">Delete review</button>
          </div>
        </div>
      </article>
    </section>
  </div>
</main>

<ng-template #mediaPreviewModal let-modal>
  <div class="media-overlay">
    <button type="button" class="media-close" (click)="modal.dismiss()" aria-label="Close">&times;</button>
    <div class="media-stage">
      <button *ngIf="mediaModalCanGoLeft" type="button" class="media-nav" (click)="mediaModalPrev()" aria-label="Previous">‹</button>
      <img *ngIf="mediaModalCurrentType === 'image'" [src]="mediaModalCurrentUrl" alt="Media preview" />
      <video *ngIf="mediaModalCurrentType === 'video'" [src]="mediaModalCurrentUrl" controls></video>
      <button *ngIf="mediaModalCanGoRight" type="button" class="media-nav next" (click)="mediaModalNext()" aria-label="Next">›</button>
    </div>
  </div>
</ng-template>

<div *ngIf="editModalOpen" class="lux-overlay">
  <div class="lux-dialog">
    <button type="button" class="lux-dialog__close" (click)="cancelEdit()" aria-label="Close">&times;</button>
    <header class="lux-dialog__head"><h3>Edit your review</h3></header>
    <div class="lux-dialog__body form-stack">
      <div>
        <p class="lux-field-label">Your rating</p>
        <div class="stars edit-stars">
          <button *ngFor="let r of [1,2,3,4,5]" type="button" (click)="newRating = r" [class.is-on]="newRating >= r">★</button>
        </div>
      </div>
      <lux-field label="Your review" inputId="review-text" [error]="reviewCommentError">
        <textarea id="review-text" class="lux-input" rows="4" [(ngModel)]="newReview" placeholder="Share your thoughts about this product..."></textarea>
      </lux-field>
      <div>
        <p class="lux-field-label">Media</p>
        <div *ngIf="mediaModalCurrentReview?.imageUrls?.length || mediaModalCurrentReview?.videoUrls?.length" class="media-grid mb">
          <div *ngFor="let imageUrl of mediaModalCurrentReview.imageUrls" class="media-thumb relative">
            <img [src]="'http://localhost:8080'+imageUrl" alt="" />
            <button type="button" class="rm" (click)="removeExistingMedia(imageUrl, 'image')" aria-label="Remove">×</button>
          </div>
          <div *ngFor="let videoUrl of mediaModalCurrentReview.videoUrls" class="media-thumb relative">
            <video [src]="videoUrl"></video>
            <button type="button" class="rm" (click)="removeExistingMedia(videoUrl, 'video')" aria-label="Remove">×</button>
          </div>
        </div>
        <label class="upload-zone" for="review-media">
          <input type="file" id="review-media" accept="image/*,video/*" (change)="onFilesSelected($event)" multiple class="hidden" />
          <span>Click to upload photos or videos</span>
          <small>PNG, JPG, MP4 up to 10MB each · max 5 files</small>
        </label>
        <p *ngIf="reviewFileError" class="lux-field-error">{{ reviewFileError }}</p>
        <div *ngIf="selectedReviewFiles.length" class="media-grid mt">
          <div *ngFor="let file of selectedReviewFiles; let i = index" class="media-thumb relative">
            <img *ngIf="file.type.startsWith('image')" [src]="file.preview" alt="" />
            <video *ngIf="file.type.startsWith('video')" [src]="file.preview"></video>
            <button type="button" class="rm" (click)="removeSelectedFile(i)" aria-label="Remove">×</button>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <lux-button variant="ghost" type="button" (pressed)="cancelEdit()">Cancel</lux-button>
        <lux-button variant="primary" type="button" (pressed)="submitReview()">Update review</lux-button>
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
