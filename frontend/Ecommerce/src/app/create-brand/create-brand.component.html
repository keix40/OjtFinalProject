<div class="admin-modal-backdrop static-modal-shell">
  <form #createBrandForm="ngForm" (ngSubmit)="createBrand(createBrandForm)" class="admin-modal admin-modal--lg relative overflow-y-auto" style="max-height:90vh;">
    <button type="button" class="admin-modal-close" (click)="activeModal.dismiss()" aria-label="Close">&times;</button>
    <div class="admin-modal__header">
      <h2 class="admin-modal__title">Create New Brand</h2>
    </div>
    <div class="admin-modal__body space-y-5">
      <div>
        <label class="lux-field-label" for="brand-name">Brand Name <span class="text-red-600">*</span></label>
        <input
          id="brand-name"
          type="text"
          class="lux-input"
          name="brandName"
          required
          [(ngModel)]="brand.brandName"
          #brandName="ngModel"
          [class.lux-input--invalid]="brandName.invalid && brandName.touched"
          placeholder="Enter brand name"
        />
        <div class="lux-field-error" *ngIf="brandName.invalid && brandName.touched">Brand name is required.</div>
      </div>

      <div>
        <label class="lux-field-label">Category Type <span class="text-red-600">*</span></label>
        <div class="lux-choice-group">
          <label class="lux-choice" [class.is-selected]="categoryOption === 'old'">
            <input type="radio" name="categoryOption" value="old" [(ngModel)]="categoryOption" />
            <span>Existing Category</span>
          </label>
          <label class="lux-choice" [class.is-selected]="categoryOption === 'new'">
            <input type="radio" name="categoryOption" value="new" [(ngModel)]="categoryOption" />
            <span>New Category</span>
          </label>
        </div>
      </div>

      <div *ngIf="categoryOption === 'old'">
        <label class="lux-field-label" for="brand-categories">Select Categories <span class="text-red-600">*</span></label>
        <select
          id="brand-categories"
          multiple
          class="lux-select admin-multiselect"
          name="selectedCategoryIds"
          [(ngModel)]="selectedCategoryIds"
          required
        >
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
        </select>
        <p class="lux-field-hint">Hold Ctrl (or Cmd on Mac) to select multiple categories.</p>
      </div>

      <div *ngIf="categoryOption === 'new'">
        <label class="lux-field-label" for="new-category-name">New Category Name <span class="text-red-600">*</span></label>
        <input
          id="new-category-name"
          type="text"
          class="lux-input"
          name="newCategoryName"
          [(ngModel)]="newCategoryName"
          placeholder="Enter new category name"
          required
        />
      </div>

      <div>
        <label class="lux-field-label">Brand Image</label>
        <div class="admin-upload">
          <input
            type="file"
            class="admin-upload__input"
            (change)="onImageSelected($event)"
            accept="image/*"
            id="imageInput"
          />
          <label for="imageInput" class="admin-upload__label">
            <span>Click to upload or drag and drop</span>
            <span class="lux-field-hint" style="margin:0.35rem 0 0;">PNG, JPG, GIF up to 10MB</span>
          </label>
        </div>
      </div>

      <div *ngIf="imagePreview">
        <label class="lux-field-label">Image Preview</label>
        <div class="relative inline-block">
          <img [src]="imagePreview" alt="Preview" class="admin-preview-img" />
          <button type="button" class="admin-preview-remove" (click)="removeImage()" aria-label="Remove image">&times;</button>
        </div>
      </div>
    </div>
    <div class="admin-modal__footer">
      <button type="button" class="lux-btn lux-btn--ghost" (click)="activeModal.dismiss()">Cancel</button>
      <button type="submit" class="lux-btn lux-btn--primary" [disabled]="!createBrandForm.valid">Create Brand</button>
    </div>
  </form>
</div>
