<div class="admin-modal-backdrop">
  <div class="admin-modal admin-modal--lg relative" role="dialog" aria-modal="true" aria-labelledby="attr-modal-title">
    <button type="button" class="admin-modal-close" (click)="closeModal()" aria-label="Close">&times;</button>
    <form (ngSubmit)="saveAttribute()" autocomplete="off" class="flex flex-col min-h-0 flex-1 overflow-hidden">
      <div class="admin-modal__header">
        <h2 id="attr-modal-title" class="admin-modal__title">{{ createMode ? 'Create New Attribute' : 'Edit Attribute' }}</h2>
      </div>
      <div class="admin-modal__body space-y-5">
        <div>
          <label class="lux-field-label" for="attr-name">Attribute Name *</label>
          <input
            id="attr-name"
            [(ngModel)]="formAttributeName"
            name="attributeName"
            required
            (ngModelChange)="checkIfColorAttribute()"
            class="lux-input"
            placeholder="Enter attribute name"
          />
        </div>

        <div>
          <label class="lux-field-label" for="attr-value">Attribute Values *</label>
          <div class="lux-input-add">
            <input
              *ngIf="isColorAttribute"
              type="color"
              [(ngModel)]="newValue"
              name="newValueColor"
              class="lux-input-add__swatch"
              aria-label="Pick color"
            />
            <input
              id="attr-value"
              [(ngModel)]="newValue"
              name="newValue"
              class="lux-input lux-input-add__field"
              placeholder="Enter value and press +"
              (keyup.enter)="addValue()"
            />
            <button type="button" class="lux-btn lux-btn--primary lux-input-add__btn" (click)="addValue()" aria-label="Add value">+</button>
          </div>

          <div *ngIf="formValues.length > 0" class="lux-chip-list">
            <div *ngFor="let val of formValues; let i = index" class="lux-chip-row">
              <ng-container *ngIf="editingValueId !== i; else editValueTpl">
                <span *ngIf="isColorAttribute" class="lux-chip-swatch" [style.backgroundColor]="val.value"></span>
                <button type="button" class="lux-chip" (click)="startEditValue(val, i)" title="Click to edit">{{ val.value }}</button>
                <button type="button" class="lux-btn lux-btn--ghost lux-btn--sm" (click)="removeValue(i)">Remove</button>
              </ng-container>
              <ng-template #editValueTpl>
                <input *ngIf="isColorAttribute" type="color" [(ngModel)]="editValue" [name]="'editColor' + i" class="lux-input-add__swatch" />
                <input [(ngModel)]="editValue" [name]="'editValue' + i" class="lux-input lux-input-add__field" />
                <button type="button" class="lux-btn lux-btn--secondary lux-btn--sm" (click)="saveEditValue(i)">Save</button>
                <button type="button" class="lux-btn lux-btn--ghost lux-btn--sm" (click)="cancelEditValue()">Cancel</button>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
      <div class="admin-modal__footer">
        <button type="button" class="lux-btn lux-btn--ghost" (click)="closeModal()">Cancel</button>
        <button
          type="submit"
          class="lux-btn lux-btn--primary"
          [disabled]="!formAttributeName.trim() || formValues.length === 0"
        >
          {{ createMode ? 'Save Attribute' : 'Save Changes' }}
        </button>
      </div>
    </form>
  </div>
</div>
