<!-- Modern Product Edit Form Container -->
<div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 py-8 px-4">
  <div class="max-w-4xl mx-auto">
    <!-- Header Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 glassmorphism rounded-2xl shadow-lg mb-4">
        <i data-lucide="package" class="w-8 h-8 text-blue-500"></i>
      </div>
      <h1 class="text-3xl font-bold text-gray-900 mb-2">Edit Product</h1>
      <p class="text-gray-600">Update your product details</p>
    </div>

    <!-- Main Form -->
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-8">
      <!-- Basic Information Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="flex items-center gap-3 mb-6">
          <i data-lucide="info" class="w-5 h-5 text-slate-500"></i>
          <h2 class="text-xl font-semibold text-slate-800">Basic Information</h2>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700">
              <i data-lucide="tag" class="w-4 h-4 inline mr-2"></i>
              Product Name
            </label>
            <input type="text" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="productName" placeholder="Enter product name">
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700">
              <i data-lucide="dollar-sign" class="w-4 h-4 inline mr-2"></i>
              Price
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500">$</span>
              <input type="number" class="w-full pl-8 pr-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="price" min="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700">
              <i data-lucide="package" class="w-4 h-4 inline mr-2"></i>
              Quantity
            </label>
            <input type="number" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="quantity" min="0" placeholder="Enter quantity">
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-700">
              <i data-lucide="toggle-left" class="w-4 h-4 inline mr-2"></i>
              Status
            </label>
            <select class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="status">
              <option value=1>Active</option>
              <option value=2>Draft</option>
              <option value=3>Archived</option>
            </select>
          </div>
        </div>
        <div class="mt-6 space-y-2">
          <label class="block text-sm font-medium text-slate-700">
            <i data-lucide="file-text" class="w-4 h-4 inline mr-2"></i>
            Description
          </label>
          <textarea class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200 resize-none" rows="4" formControlName="description" placeholder="Enter product description..."></textarea>
        </div>
      </div>

      <!-- Categories & Brands Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="flex items-center gap-3 mb-6">
          <i data-lucide="layers" class="w-5 h-5 text-slate-500"></i>
          <h2 class="text-xl font-semibold text-slate-800">Categories & Brands</h2>
        </div>
        <div formArrayName="categoryBrandArray" class="space-y-4">
          <div *ngFor="let group of categoryBrandArray.controls; let i = index" [formGroupName]="i" class="flex items-center gap-4 p-4 bg-slate-50 rounded-xl">
            <div class="flex-1">
              <select class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="categoryId">
                <option [ngValue]="null" disabled>Select Category</option>
                <option *ngFor="let category of categories" [ngValue]="category.id">{{ category.name }}</option>
              </select>
            </div>
            <div class="flex-1">
              <select class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-slate-500 focus:border-slate-500 transition-all duration-200" formControlName="brandId">
                <option [ngValue]="null">No Brand</option>
                <option *ngFor="let brand of brands" [ngValue]="brand.id">{{ brand.name }}</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Image Upload Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="flex items-center gap-3 mb-6">
          <i data-lucide="image" class="w-5 h-5 text-slate-500"></i>
          <h2 class="text-xl font-semibold text-slate-800">Product Images</h2>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mt-6" *ngIf="selectedImagesPreview.length > 0">
          <div class="relative group" *ngFor="let image of selectedImagesPreview; let i = index">
            <img [src]="image" alt="Preview" class="w-full h-24 object-cover rounded-lg" />
          </div>
        </div>
      </div>

      <!-- Variations Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-slate-200">
        <div class="flex items-center gap-3 mb-6">
          <i data-lucide="settings" class="w-5 h-5 text-slate-500"></i>
          <h2 class="text-xl font-semibold text-slate-800">Product Variations</h2>
        </div>
        <div formArrayName="variants">
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div *ngFor="let variant of variants.controls; let variantIndex = index" [formGroupName]="variantIndex" class="bg-slate-50 rounded-xl p-6 border border-slate-200">
              <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                  <i data-lucide="package" class="w-5 h-5 text-slate-500"></i>
                  <h4 class="font-semibold text-slate-800">Variant {{ variantIndex + 1 }}</h4>
                </div>
                <span class="text-sm text-slate-500">{{ variant.get('sku')?.value }}</span>
              </div>
              <div class="mb-4">
                <div class="flex flex-wrap gap-2">
                  <span *ngFor="let attr of (variant.get('attributes')?.value || [])" class="px-3 py-1 bg-slate-200 text-slate-700 rounded-full text-sm">
                    {{ attr.attributeName }}: {{ attr.value }}
                  </span>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Price</label>
                  <div class="relative">
                    <span class="absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500">$</span>
                    <input type="number" class="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500" formControlName="price" min="0.01" step="0.01">
                  </div>
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Stock</label>
                  <input type="number" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-slate-500 focus:border-slate-500" formControlName="stock" min="0">
                </div>
              </div>
              <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-2">Variant Images</label>
                <div class="grid grid-cols-4 gap-2 mt-3" *ngIf="(variant.get('images')?.value || []).length > 0">
                  <div class="relative group" *ngFor="let image of (variant.get('images')?.value || []); let imageIndex = index">
                    <img [src]="image.preview || image" alt="Variant preview" class="w-full h-16 object-cover rounded-lg" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Submit Button -->
      <div class="flex flex-col items-center">
        <button type="submit" class="flex items-center gap-3 px-8 py-4 bg-slate-600 text-white rounded-xl hover:bg-slate-700 transition-all duration-200 shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed">
          <i data-lucide="plus" class="w-5 h-5"></i>
          Update Product
        </button>
      </div>
    </form>
  </div>
</div>
