<lux-page-shell variant="admin" shellClass="admin-page return-admin">
  <lux-page-header
    variant="admin"
    eyebrow="Operations"
    title="Returns & Refunds"
    subtitle="Review return requests, approve decisions, and export reports.">
    <div actions class="admin-export-group">
      <div class="admin-export relative">
        <lux-button variant="secondary" (pressed)="toggleExcelDropdown()">Export CSV</lux-button>
        <div *ngIf="showExcelDropdown" class="admin-menu">
          <button type="button" (click)="exportExcel('all'); showExcelDropdown = false">Export all</button>
          <button type="button" [disabled]="selectedRows.length === 0" (click)="exportExcel('selected'); showExcelDropdown = false">
            Export selected ({{ selectedRows.length }})
          </button>
        </div>
      </div>
      <div class="admin-export relative">
        <lux-button variant="ghost" (pressed)="togglePdfDropdown()">Export PDF</lux-button>
        <div *ngIf="showPdfDropdown" class="admin-menu">
          <button type="button" (click)="exportPDF('all'); showPdfDropdown = false">Export all</button>
          <button type="button" [disabled]="selectedRows.length === 0" (click)="exportPDF('selected'); showPdfDropdown = false">
            Export selected ({{ selectedRows.length }})
          </button>
        </div>
      </div>
    </div>
  </lux-page-header>

  <lux-filter-bar filters>
    <div primary class="admin-filter-fields">
      <lux-field label="Search">
        <input
          class="lux-input"
          type="text"
          [(ngModel)]="searchText"
          (input)="onSearchChange()"
          placeholder="Customer, product, reason, order…" />
      </lux-field>
      <lux-field label="Status">
        <select class="lux-input" [(ngModel)]="statusFilter" (change)="onStatusFilterChange()">
          <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
        </select>
      </lux-field>
      <lux-field label="Sort">
        <select class="lux-input" [(ngModel)]="sortBy" (change)="onSortChange()">
          <option *ngFor="let opt of sortOptions" [value]="opt.value">{{ opt.label }}</option>
        </select>
      </lux-field>
    </div>
    <div secondary class="admin-filter-meta">
      <span class="lux-data">{{ totalItems }} returns</span>
      <lux-button variant="ghost" (pressed)="clearFilters()">Clear</lux-button>
    </div>
  </lux-filter-bar>

  <div class="page-panel" *ngIf="!isLoading; else loadingTpl">
    <lux-table
      [rows]="paginatedReturns"
      [selectable]="true"
      [allSelected]="allPageSelected"
      [partialSelected]="partialPageSelected"
      [isSelected]="isRowSelected"
      [trackBy]="trackByReturn"
      (toggleAll)="onToggleAll($event)"
      (toggleRow)="onToggleRow($event)">
      <ng-template luxColumn="order" header="Order" let-row>
        <span class="cell-strong">{{ row.orderCode }}</span>
      </ng-template>
      <ng-template luxColumn="date" header="Date" let-row>
        {{ row.requestedAt | date:'dd MMM yyyy' }}
      </ng-template>
      <ng-template luxColumn="product" header="Product" let-row>
        {{ getProductNames(row) }}
      </ng-template>
      <ng-template luxColumn="customer" header="Customer" let-row>
        {{ row.userName }}
      </ng-template>
      <ng-template luxColumn="reason" header="Reason" let-row>
        <span class="cell-muted">{{ row.reasonForReturn }}</span>
      </ng-template>
      <ng-template luxColumn="status" header="Status" let-row>
        <lux-badge [tone]="statusTone(row.status)">{{ row.status }}</lux-badge>
      </ng-template>
      <ng-template luxColumn="actions" header="Actions" let-row>
        <a class="lux-btn lux-btn--secondary" [routerLink]="['/return', row.id]">View</a>
      </ng-template>
      <lux-empty-state empty eyebrow="Returns" title="No return requests" message="No returns match your current filters.">
        <lux-button variant="secondary" (pressed)="clearFilters()">Clear filters</lux-button>
      </lux-empty-state>
    </lux-table>

    <lux-paginator
      [page]="currentPage"
      [size]="pageSize"
      [totalElements]="totalItems"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)">
    </lux-paginator>
  </div>

  <ng-template #loadingTpl>
    <div class="page-panel admin-loading">Loading return requests…</div>
  </ng-template>
</lux-page-shell>
