<app-header></app-header>

<div class="customer-maison-page customer-breadcrumb">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
    <nav class="flex items-center space-x-2 text-sm" aria-label="Breadcrumb">
      <a routerLink="/home">Home</a>
      <span class="text-stone">/</span>
      <span class="lux-body-sm text-ink" aria-current="page">Maisons</span>
    </nav>
  </div>
</div>

<main class="customer-maison-page pb-20">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <header class="maison-hero">
      <p class="lux-overline mb-3">Houses</p>
      <h1 class="lux-h1 mb-3">Featured maisons</h1>
      <p class="lux-body max-w-2xl mx-auto">A directory of creators and houses we stand behind.</p>
    </header>

    <lux-async-state
      [loading]="loading"
      [error]="error"
      [empty]="!brands.length"
      loadingLabel="Loading maisons"
      skeletonHeight="12rem"
      emptyTitle="Our house directory is being curated"
      (retry)="loadBrands()"
    >
      <div class="maison-grid">
        <button
          type="button"
          *ngFor="let brand of brands"
          class="maison-tile"
          (click)="goToBrand(brand)"
        >
          <span class="maison-tile__media flex items-center justify-center bg-porcelain">
            <img
              *ngIf="getBrandImageUrl(brand) && getBrandImageUrl(brand) !== 'assets/images/default-brand.svg'"
              [src]="getBrandImageUrl(brand)"
              [alt]="brand.name"
              class="object-contain p-6 max-h-full max-w-full"
              loading="lazy"
            />
            <span *ngIf="!brand.image || getBrandImageUrl(brand) === 'assets/images/default-brand.svg'" class="lux-h2 text-ink">
              {{ brand.name.charAt(0) }}
            </span>
          </span>
          <span class="maison-tile__body">
            <span class="lux-overline">Maison</span>
            <span class="lux-h3 block mt-1">{{ brand.name }}</span>
          </span>
        </button>
      </div>
    </lux-async-state>
  </div>
</main>

<app-footer></app-footer>
