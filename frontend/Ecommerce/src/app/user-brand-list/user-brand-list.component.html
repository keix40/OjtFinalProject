<app-header></app-header>
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 mb-14">
  <div class="text-center mb-16">
    <h2 class="text-4xl lg:text-5xl font-bold text-neutral-900 mb-4 animate-slide-up">
      All <span class="text-primary-600">Brands</span>
    </h2>
  </div>
  <div *ngIf="loading" class="text-center text-lg">Loading brands...</div>
  <div *ngIf="error" class="text-center text-red-500">{{ error }}</div>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-8" *ngIf="!loading && !error">
    <div *ngFor="let brand of brands" (click)="goToBrand(brand)"
      class="group relative bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300 hover:-translate-y-2 border border-neutral-200 animate-fade-in cursor-pointer flex flex-col items-center p-6">
      <div class="w-28 h-28 rounded-full flex items-center justify-center mb-4 overflow-hidden bg-gray-100">
        <img *ngIf="getBrandImageUrl(brand) && getBrandImageUrl(brand) !== 'assets/images/default-brand.svg'" [src]="getBrandImageUrl(brand)" [alt]="brand.name" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
        <span *ngIf="!brand.image || getBrandImageUrl(brand) === 'assets/images/default-brand.svg'"
          class="w-full h-full flex items-center justify-center text-4xl font-bold text-white"
          [ngClass]="'bg-primary-600'">
          {{ brand.name ? brand.name[0] : '?' }}
        </span>
      </div>
      <div class="text-center font-semibold text-neutral-900 text-lg truncate w-full">{{ brand.name }}</div>
    </div>
  </div>
</div>
<app-footer></app-footer>
