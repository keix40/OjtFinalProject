<app-header></app-header>

<!-- Hero Section -->
<section class="relative bg-white py-20 overflow-hidden">
  <div class="absolute inset-0 bg-blue-50"></div>
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center">
      <h1 class="text-5xl lg:text-6xl font-bold text-black mb-6">
        Explore <span class="text-blue-600">Brands</span>
      </h1>
      <p class="text-xl text-gray-600 max-w-3xl mx-auto leading-relaxed">
        Discover premium brands and find your favorite products from trusted manufacturers and designers.
      </p>
    </div>
  </div>
</section>

<!-- Brands Section -->
<section class="py-20 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Loading State -->
    <div *ngIf="loading" class="text-center py-20">
      <div class="inline-flex items-center px-6 py-3 bg-blue-100 text-blue-800 rounded-full text-lg font-medium">
        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Loading brands...
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="text-center py-20">
      <div class="inline-flex items-center px-6 py-3 bg-red-100 text-red-800 rounded-full text-lg font-medium">
        <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
        </svg>
        {{ error }}
      </div>
    </div>

    <!-- Brands Grid -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4" *ngIf="!loading && !error">
      <div 
        *ngFor="let brand of brands" 
        class="group bg-white rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 border border-gray-200 cursor-pointer overflow-hidden relative"
        (click)="goToBrand(brand)"
      >
                          <!-- Brand Image Container -->
         <div class="relative aspect-square overflow-hidden">
           <img 
             *ngIf="getBrandImageUrl(brand) && getBrandImageUrl(brand) !== 'assets/images/default-brand.svg'" 
             [src]="getBrandImageUrl(brand)" 
             [alt]="brand.name" 
             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300"
           >
           <div 
             *ngIf="!brand.image || getBrandImageUrl(brand) === 'assets/images/default-brand.svg'"
             class="w-full h-full bg-blue-600 flex items-center justify-center text-white font-bold text-2xl group-hover:scale-110 transition-transform duration-300"
           >
             {{ brand.name ? brand.name[0] : '?' }}
           </div>
           
           <!-- Brand Name Overlay on Hover -->
           <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-end justify-center pb-4 pointer-events-none z-20">
             <h3 class="text-white font-bold text-base text-center px-2 drop-shadow-lg">
               {{ brand.name }}
             </h3>
           </div>
         </div>
      </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!loading && !error && brands.length === 0" class="text-center py-20">
      <div class="inline-flex flex-col items-center">
        <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mb-6">
          <svg class="w-12 h-12 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-black mb-2">No Brands Found</h3>
        <p class="text-gray-600">We're working on adding more brands. Please check back later.</p>
      </div>
    </div>
  </div>
</section>
