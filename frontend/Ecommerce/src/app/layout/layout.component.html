<div class="d-flex flex-column vh-100 custom-layout">
  <app-navbar class="shadow-sm"></app-navbar>
  
  <div class="d-flex flex-grow-1 layout-container position-relative">
    <!-- Sidebar - Fixed positioning with proper z-index -->
    <app-sidebar class="shadow-sm position-fixed h-full" 
                style="z-index: 1000;"></app-sidebar>
    
    <!-- Main Content - Dynamic padding based on sidebar state -->
    <div class="main-content flex-grow-1 transition-all duration-500" 
         [ngClass]="sidebarExpanded ? 'ml-64' : 'ml-20'">
      <div class="content-wrapper p-4" [ngClass]="{'rounded-tl-none': sidebarExpanded}">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
