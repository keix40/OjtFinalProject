<lux-page-shell variant="admin" shellClass="admin-page">
  <lux-page-header
    variant="admin"
    eyebrow="Catalogue"
    title="Brand Management"
    subtitle="Manage brands and their category links."
  >
    <div actions>
      <lux-button
        variant="primary"
        [disabled]="!permissionService.hasPermission(PermissionConstants.BRANDS_CREATE)"
        (pressed)="openCreateBrandModal()"
      >
        Add Brand
      </lux-button>
    </div>
  </lux-page-header>

  <div class="admin-kpi-grid">
    <div class="admin-kpi">
      <div class="admin-kpi__label">Brands</div>
      <div class="admin-kpi__value">{{ totalItems }}</div>
    </div>
    <div class="admin-kpi">
      <div class="admin-kpi__label">Selected</div>
      <div class="admin-kpi__value">{{ selectedCount }}</div>
    </div>
  </div>

  <lux-filter-bar>
    <div primary>
      <lux-field label="Search" inputId="brand-search">
        <input
          id="brand-search"
          type="text"
          class="lux-input"
          [(ngModel)]="searchTerm"
          (input)="onSearch()"
          placeholder="Search brands or categories…"
        />
      </lux-field>
    </div>
    <div secondary class="brand-toolbar">
      <div class="lux-export-menu relative">
        <lux-button variant="secondary" (pressed)="toggleCsvDropdown()">Export CSV</lux-button>
        <div *ngIf="csvDropdownOpen" class="admin-dropdown">
          <button type="button" (click)="exportToCSV('all'); csvDropdownOpen = false">Export All</button>
          <button type="button" [disabled]="selectedCount === 0" (click)="exportToCSV('selected'); csvDropdownOpen = false">
            Export Selected ({{ selectedCount }})
          </button>
        </div>
      </div>
      <div class="lux-export-menu relative">
        <lux-button variant="secondary" (pressed)="togglePdfDropdown()">Export PDF</lux-button>
        <div *ngIf="pdfDropdownOpen" class="admin-dropdown">
          <button type="button" (click)="exportToPDF('all'); pdfDropdownOpen = false">Export All</button>
          <button type="button" [disabled]="selectedCount === 0" (click)="exportToPDF('selected'); pdfDropdownOpen = false">
            Export Selected ({{ selectedCount }})
          </button>
        </div>
      </div>
    </div>
  </lux-filter-bar>

  <section class="page-panel brand-panel">
    <lux-async-state *ngIf="loading" [loading]="true" loadingLabel="Loading brands" [skeletonCount]="3" skeletonHeight="3rem"></lux-async-state>

    <lux-table
      *ngIf="!loading"
      [rows]="paginatedBrands"
      [selectable]="true"
      [allSelected]="allPageSelected"
      [partialSelected]="partialPageSelected"
      [isSelected]="isRowSelected"
      [trackBy]="trackById"
      (toggleAll)="onToggleAll($event)"
      (toggleRow)="onToggleRow($event)"
    >
      <ng-template luxColumn="brand" header="Brand" let-brand>
        <div class="brand-cell">
          <div *ngIf="getBrandImageUrl(brand) && !hasImageFailed(brand)" class="brand-avatar">
            <img [src]="getBrandImageUrl(brand)" [alt]="brand.name" (error)="onImageError($event, brand.id)" />
          </div>
          <div
            *ngIf="!getBrandImageUrl(brand) || hasImageFailed(brand)"
            class="brand-avatar brand-avatar--fallback"
            [style.background]="getBrandTone(brand)"
          >
            {{ getBrandInitial(brand) }}
          </div>
          <span class="brand-name">{{ brand.name }}</span>
        </div>
      </ng-template>
      <ng-template luxColumn="categories" header="Categories" let-brand>
        <div class="brand-tags">
          <lux-badge *ngFor="let category of brand.categories" tone="success">{{ category.name }}</lux-badge>
          <span *ngIf="brand.categories.length === 0" class="brand-muted">No categories</span>
        </div>
      </ng-template>
      <ng-template luxColumn="actions" header="Actions" let-brand>
        <div class="brand-actions">
          <lux-button
            variant="ghost"
            [disabled]="!permissionService.hasPermission(PermissionConstants.BRANDS_UPDATE)"
            (pressed)="editBrand(brand)"
          >
            Edit
          </lux-button>
          <lux-button
            variant="ghost"
            [disabled]="!permissionService.hasPermission(PermissionConstants.BRANDS_DELETE)"
            (pressed)="deleteBrand(brand)"
          >
            Delete
          </lux-button>
        </div>
      </ng-template>
      <lux-empty-state
        empty
        title="No brands found"
        [message]="searchTerm ? 'Try adjusting your search.' : 'Create a brand to get started.'"
      ></lux-empty-state>
    </lux-table>

    <lux-paginator
      *ngIf="!loading && totalItems > 0"
      [page]="currentPage"
      [size]="itemsPerPage"
      [totalElements]="totalItems"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)"
    ></lux-paginator>
  </section>
</lux-page-shell>
