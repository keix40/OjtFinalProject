<lux-page-shell variant="admin" shellClass="admin-page">
  <lux-page-header
    variant="admin"
    eyebrow="Catalogue"
    title="Category Management"
    subtitle="Organize product categories and subcategories."
  >
    <div actions>
      <lux-button
        variant="primary"
        [disabled]="!permissionService.hasPermission(PermissionConstants.CATEGORIES_CREATE)"
        (pressed)="openCreateCategoryModal()"
      >
        Add Category
      </lux-button>
    </div>
  </lux-page-header>

  <div class="admin-kpi-grid">
    <div class="admin-kpi">
      <div class="admin-kpi__label">Categories</div>
      <div class="admin-kpi__value">{{ totalItems }}</div>
    </div>
    <div class="admin-kpi">
      <div class="admin-kpi__label">Selected</div>
      <div class="admin-kpi__value">{{ selectedCount }}</div>
    </div>
  </div>

  <lux-filter-bar>
    <div primary>
      <lux-field label="Search" inputId="cat-search">
        <input
          id="cat-search"
          type="text"
          class="lux-input"
          [(ngModel)]="searchTerm"
          (input)="onSearch()"
          placeholder="Search categories…"
        />
      </lux-field>
    </div>
    <div secondary class="cat-toolbar">
      <div class="lux-export-menu relative">
        <lux-button variant="secondary" (pressed)="csvDropdownOpen = !csvDropdownOpen; pdfDropdownOpen = false">Export CSV</lux-button>
        <div *ngIf="csvDropdownOpen" class="admin-dropdown">
          <button type="button" (click)="exportToCSV('all'); csvDropdownOpen = false">Export All</button>
          <button type="button" [disabled]="selectedCount === 0" (click)="exportToCSV('selected'); csvDropdownOpen = false">
            Export Selected ({{ selectedCount }})
          </button>
        </div>
      </div>
      <div class="lux-export-menu relative">
        <lux-button variant="secondary" (pressed)="pdfDropdownOpen = !pdfDropdownOpen; csvDropdownOpen = false">Export PDF</lux-button>
        <div *ngIf="pdfDropdownOpen" class="admin-dropdown">
          <button type="button" (click)="exportToPDF('all'); pdfDropdownOpen = false">Export All</button>
          <button type="button" [disabled]="selectedCount === 0" (click)="exportToPDF('selected'); pdfDropdownOpen = false">
            Export Selected ({{ selectedCount }})
          </button>
        </div>
      </div>
    </div>
  </lux-filter-bar>

  <section class="page-panel cat-panel">
    <lux-async-state *ngIf="loading" [loading]="true" loadingLabel="Loading categories" [skeletonCount]="3" skeletonHeight="3rem"></lux-async-state>

    <lux-table
      *ngIf="!loading"
      [rows]="paginatedCategories"
      [selectable]="true"
      [allSelected]="allPageSelected"
      [partialSelected]="partialPageSelected"
      [isSelected]="isRowSelected"
      [trackBy]="trackById"
      (toggleAll)="onToggleAll($event)"
      (toggleRow)="onToggleRow($event)"
    >
      <ng-template luxColumn="image" header="Image" let-cat>
        <div class="cat-avatar">
          <img *ngIf="getCategoryImageUrl(cat); else initial" [src]="getCategoryImageUrl(cat)" [alt]="cat.name" />
          <ng-template #initial>
            <span class="cat-avatar__initial">{{ cat.name ? cat.name.charAt(0).toUpperCase() : '?' }}</span>
          </ng-template>
        </div>
      </ng-template>
      <ng-template luxColumn="name" header="Category" let-cat>
        <div class="cat-name" [ngStyle]="getCategoryIndentStyle(cat.level)">{{ cat.name }}</div>
      </ng-template>
      <ng-template luxColumn="subs" header="Subcategories" let-cat>
        <div class="cat-tags" *ngIf="cat.subcategories?.length; else noSub">
          <lux-badge *ngFor="let sub of cat.subcategories" tone="info">{{ sub.name }}</lux-badge>
        </div>
        <ng-template #noSub><span class="cat-muted">—</span></ng-template>
      </ng-template>
      <ng-template luxColumn="actions" header="Actions" let-cat>
        <div class="cat-actions">
          <lux-button
            variant="ghost"
            [disabled]="!permissionService.hasPermission(PermissionConstants.CATEGORIES_CREATE)"
            (pressed)="openAddSubCategoryModal(cat.id)"
          >
            Add Sub
          </lux-button>
          <lux-button
            variant="ghost"
            [disabled]="!permissionService.hasPermission(PermissionConstants.CATEGORIES_UPDATE)"
            (pressed)="editCategory(cat)"
          >
            Edit
          </lux-button>
          <lux-button
            variant="ghost"
            [disabled]="!permissionService.hasPermission(PermissionConstants.CATEGORIES_DELETE)"
            (pressed)="deleteCategory(cat)"
          >
            Delete
          </lux-button>
        </div>
      </ng-template>
      <lux-empty-state
        empty
        title="No categories found"
        [message]="searchTerm ? 'Try adjusting your search.' : 'Create a category to get started.'"
      ></lux-empty-state>
    </lux-table>

    <lux-paginator
      *ngIf="!loading && totalItems > 0"
      [page]="currentPage"
      [size]="itemsPerPage"
      [totalElements]="totalItems"
      [totalPages]="totalPages"
      (pageChange)="onPageChange($event)"
    ></lux-paginator>
  </section>
</lux-page-shell>
