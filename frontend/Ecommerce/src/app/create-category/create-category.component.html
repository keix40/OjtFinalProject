<div class="fixed inset-0 z-40 flex items-center justify-center">

<div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
    
<form #createCategoryForm="ngForm" (ngSubmit)="createCategory(createCategoryForm)" class="w-full max-w-xl mx-auto bg-white rounded-xl shadow-2xl p-6 md:p-8 relative overflow-y-auto scrollbar-hide" style="max-height:90vh;">
  <!-- Close Button -->
  <button 
    type="button" 
    class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-2xl font-bold focus:outline-none"
    (click)="activeModal.dismiss()"
    aria-label="Close"
  >
    &times;
  </button>
  <!-- Modal Title -->
  <div class="mb-6 text-center">
    <h5 class="text-2xl font-bold text-gray-900">Create Category</h5>
  </div>
  <!-- Modal Body -->
  <div class="space-y-6">
    <!-- Parent Category -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Main Category (optional):</label>
      <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" name="parentCategoryId" [(ngModel)]="selectedParentCategoryId">
        <option [ngValue]="null" selected>-- No Parent (Main Category) --</option>
        <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
      </select>
    </div>
    <!-- New Category Names -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">New Category Name(s):</label>
      <div *ngFor="let name of categoryNames; let i = index; trackBy: trackByIndex" class="flex gap-2 mb-2">
        <input
          type="text"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
          name="categoryName{{ i }}"
          [(ngModel)]="categoryNames[i]"
          required
          placeholder="Enter new category name"
        />
        <button
          *ngIf="categoryNames.length > 1"
          type="button"
          class="bg-red-100 text-red-600 hover:bg-red-200 rounded-lg px-3 py-2 font-semibold transition-colors duration-200"
          (click)="removeCategoryField(i)">
          Remove
        </button>
      </div>
      <button type="button" class="bg-blue-100 text-blue-700 hover:bg-blue-200 rounded-full px-4 py-2 text-sm font-semibold transition-colors duration-200" (click)="addCategoryField()">
        + Add More
      </button>
    </div>
    <!-- Brand Type -->
    <div class="space-y-3">
      <label class="block text-sm font-semibold text-gray-700 mb-3">Brand Type:</label>
      <div class="flex flex-col sm:flex-row gap-4">
        <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 transition-all duration-200">
          <input class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" type="radio" name="BrandOption" value="old" [(ngModel)]="brandOption" id="oldBrand" />
          <span class="ml-3 text-sm font-medium text-gray-700">Old Brand</span>
        </label>
        <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 transition-all duration-200">
          <input class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" type="radio" name="BrandOption" value="new" [(ngModel)]="brandOption" id="newBrand" />
          <span class="ml-3 text-sm font-medium text-gray-700">New Brand</span>
        </label>
        <label class="flex items-center p-4 border-2 border-gray-200 rounded-lg cursor-pointer hover:border-blue-300 transition-all duration-200">
          <input class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500" type="radio" name="BrandOption" value="none" [(ngModel)]="brandOption" id="none" />
          <span class="ml-3 text-sm font-medium text-gray-700">None</span>
        </label>
      </div>
    </div>
    <!-- Old Brand Dropdown -->
    <div class="space-y-2" *ngIf="brandOption === 'old'">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Select Brand:</label>
      <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200" name="selectedBrandId" [(ngModel)]="selectedBrandId" required>
        <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
      </select>
    </div>
    <!-- New Brand Name -->
    <div class="space-y-2" *ngIf="brandOption === 'new'">
      <label class="block text-sm font-semibold text-gray-700 mb-2">New Brand Name:</label>
      <input
        type="text"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 placeholder-gray-400"
        name="newBrandName"
        [(ngModel)]="newBrandName"
        placeholder="Enter new brand name"
        required
      />
    </div>
    <!-- Category Image Upload -->
    <div class="space-y-3">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Category Image:</label>
      <div class="relative">
        <input
          type="file"
          class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
          (change)="onImageSelected($event)"
          accept="image/*"
          id="categoryImageInput"
        />
        <label for="categoryImageInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-blue-400 rounded-xl bg-blue-50 hover:bg-blue-100 transition-colors duration-200 cursor-pointer select-none text-center p-6">
          <svg class="h-14 w-14 text-blue-400 mb-2" stroke="currentColor" fill="none" viewBox="0 0 48 48">
            <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="text-base font-medium text-blue-700">Click to upload or drag and drop</span>
          <span class="text-xs text-gray-500 mt-1">PNG, JPG, GIF up to 10MB</span>
        </label>
      </div>
    </div>
    <!-- Image preview -->
    <div *ngIf="imagePreviewUrl" class="space-y-2">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Image Preview:</label>
      <div class="relative inline-block">
        <img [src]="imagePreviewUrl" alt="Image Preview" class="max-w-[120px] max-h-[90px] rounded-lg shadow-md border border-gray-200 object-contain" />
        <button 
          type="button"
          class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center hover:bg-red-600 transition-colors duration-200"
          (click)="removeImage()">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <!-- Modal Footer -->
  <div class="flex justify-end gap-2 mt-8">
    <button 
      type="button"
      class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition text-sm"
      (click)="activeModal.dismiss()"
    >
      Cancel
    </button>
    <button 
      type="submit" 
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-semibold flex items-center gap-2"
      [disabled]="!createCategoryForm.valid"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
      </svg>
      Create Category
    </button>
  </div>
</form>
