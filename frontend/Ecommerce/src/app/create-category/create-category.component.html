<div class="admin-modal-backdrop static-modal-shell">
  <form #createCategoryForm="ngForm" (ngSubmit)="createCategory(createCategoryForm)" class="admin-modal admin-modal--lg relative overflow-y-auto" style="max-height:90vh;">
    <button type="button" class="admin-modal-close" (click)="activeModal.dismiss()" aria-label="Close">&times;</button>
    <div class="admin-modal__header">
      <h2 class="admin-modal__title">Create Category</h2>
    </div>
    <div class="admin-modal__body space-y-5">
      <div>
        <label class="lux-field-label" for="parent-category">Main Category (optional)</label>
        <select
          id="parent-category"
          class="lux-select"
          name="parentCategoryId"
          [(ngModel)]="selectedParentCategoryId"
        >
          <option [ngValue]="null">-- No Parent (Main Category) --</option>
          <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div>
        <label class="lux-field-label">New Category Name(s)</label>
        <div *ngFor="let name of categoryNames; let i = index; trackBy: trackByIndex" class="lux-input-add" style="margin-bottom:0.5rem;">
          <input
            type="text"
            class="lux-input lux-input-add__field"
            name="categoryName{{ i }}"
            [(ngModel)]="categoryNames[i]"
            required
            placeholder="Enter new category name"
          />
          <button
            *ngIf="categoryNames.length > 1"
            type="button"
            class="lux-btn lux-btn--ghost lux-btn--sm"
            (click)="removeCategoryField(i)"
          >
            Remove
          </button>
        </div>
        <button type="button" class="lux-btn lux-btn--secondary lux-btn--sm" (click)="addCategoryField()">+ Add More</button>
      </div>

      <div>
        <label class="lux-field-label">Brand Type</label>
        <div class="lux-choice-group">
          <label class="lux-choice" [class.is-selected]="brandOption === 'old'">
            <input type="radio" name="BrandOption" value="old" [(ngModel)]="brandOption" />
            <span>Existing Brand</span>
          </label>
          <label class="lux-choice" [class.is-selected]="brandOption === 'new'">
            <input type="radio" name="BrandOption" value="new" [(ngModel)]="brandOption" />
            <span>New Brand</span>
          </label>
          <label class="lux-choice" [class.is-selected]="brandOption === 'none'">
            <input type="radio" name="BrandOption" value="none" [(ngModel)]="brandOption" />
            <span>None</span>
          </label>
        </div>
      </div>

      <div *ngIf="brandOption === 'old'">
        <label class="lux-field-label" for="select-brand">Select Brand</label>
        <select
          id="select-brand"
          class="lux-select"
          name="selectedBrandId"
          [(ngModel)]="selectedBrandId"
          required
        >
          <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
        </select>
      </div>

      <div *ngIf="brandOption === 'new'">
        <label class="lux-field-label" for="new-brand-name">New Brand Name</label>
        <input
          id="new-brand-name"
          type="text"
          class="lux-input"
          name="newBrandName"
          [(ngModel)]="newBrandName"
          placeholder="Enter new brand name"
          required
        />
      </div>

      <div>
        <label class="lux-field-label">Category Image</label>
        <div class="admin-upload">
          <input
            type="file"
            accept=".jpg,.jpeg,.png,.gif,.webp,.svg"
            id="categoryImageInput"
            (change)="onCategoryImageSelected($event)"
            class="admin-upload__input"
          />
          <label for="categoryImageInput" class="admin-upload__label">
            <span>Click to upload or drag and drop</span>
            <span class="lux-field-hint" style="margin:0.35rem 0 0;">PNG, JPG, GIF, WEBP, SVG up to 10MB</span>
          </label>
        </div>
        <div *ngIf="imagePreviewUrl" class="mt-3 flex items-center gap-2">
          <img [src]="imagePreviewUrl" alt="Image Preview" class="admin-preview-img" />
          <button type="button" class="lux-btn lux-btn--ghost lux-btn--sm" (click)="removeImage()">Remove</button>
        </div>
      </div>
    </div>
    <div class="admin-modal__footer">
      <button type="button" class="lux-btn lux-btn--ghost" (click)="activeModal.dismiss()">Cancel</button>
      <button type="submit" class="lux-btn lux-btn--primary" [disabled]="!createCategoryForm.valid">Create Category</button>
    </div>
  </form>
</div>
