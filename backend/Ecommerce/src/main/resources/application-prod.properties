# Production profile — activate with SPRING_PROFILES_ACTIVE=prod (set on Render).

server.port=${PORT:8080}

# Database (Aiven MySQL). Set DB_URL with SSL, e.g.:
# jdbc:mysql://HOST:PORT/DATABASE?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# HTTPS cookies for cross-origin frontend (Vercel)
app.auth.cookie.secure=${COOKIE_SECURE:true}

# CORS — comma-separated Vercel preview/production origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ojt-final-project.vercel.app}

# Redis optional (shared JWT blacklist + rate limits across instances)
app.redis.enabled=${REDIS_ENABLED:false}

# Actuator health for Render health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Reduce noise in production logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
