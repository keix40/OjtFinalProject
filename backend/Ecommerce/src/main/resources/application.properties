spring.application.name=Ecommerce

# Configure these values in Render. The defaults are for local development only.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}?sslMode=${DB_SSL_MODE:DISABLED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}

# Always provide JWT_SECRET in Render; do not use the local development fallback in production.
app.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-2026-abcdefghijk}
app.jwt.expiration=86400000
jwt.refresh.expiration=604800000

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Set these only when SMS OTP is enabled.
twilio.account_sid=${TWILIO_ACCOUNT_SID:}
twilio.auth_token=${TWILIO_AUTH_TOKEN:}
twilio.phone_number=${TWILIO_PHONE_NUMBER:}
