spring.application.name=Ecommerce

# Active profile (Render sets SPRING_PROFILES_ACTIVE=prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# HTTP port (Render injects PORT)
server.port=${PORT:8080}

# CORS — comma-separated origin patterns (see CORS_ALLOWED_ORIGINS in /.env.example)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000}

# Optional Redis is wired via RedisConfig; skip default autoconfig to avoid localhost connection attempts
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# Database — set all values via environment variables (see /.env.example)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Legacy Spring Security user (disable in production by omitting env vars)
spring.security.user.name=${SPRING_SECURITY_USER_NAME:}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:}

# JWT — JWT_SECRET is required in production
app.jwt.secret=${JWT_SECRET:local-dev-only-change-before-production-minimum-64-chars-abcdefghijklmnop}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Auth cookies (HttpOnly). Set COOKIE_SECURE=true in production (HTTPS).
app.auth.cookie.access-name=${AUTH_ACCESS_COOKIE:access_token}
app.auth.cookie.refresh-name=${AUTH_REFRESH_COOKIE:refresh_token}
app.auth.cookie.secure=${COOKIE_SECURE:false}
app.auth.cookie.same-site=${COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${COOKIE_DOMAIN:}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio (optional)
twilio.account_sid=${TWILIO_ACCOUNT_SID:}
twilio.auth_token=${TWILIO_AUTH_TOKEN:}
twilio.phone_number=${TWILIO_PHONE_NUMBER:}

# IPQualityScore (optional VPN/proxy detection on login)
ipqs.api.key=${IPQS_API_KEY:}

# Auth rate limiting (in-memory per IP; use Redis for multi-instance)
app.rate-limit.auth.enabled=${AUTH_RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.requests-per-minute=${AUTH_RATE_LIMIT_RPM:30}

# Upload directories (relative to working directory unless absolute)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.upload.return-images-dir=${APP_RETURN_IMAGES_DIR:return_images}
app.upload.review-dir=${APP_REVIEW_UPLOAD_DIR:review}
app.upload.product-dir=${APP_PRODUCT_UPLOAD_DIR:product_image}
app.upload.category-dir=${APP_CATEGORY_UPLOAD_DIR:brand_and_category_image}
app.upload.event-dir=${APP_EVENT_UPLOAD_DIR:event}

# Redis (optional — enables shared JWT blacklist + auth rate limits across instances)
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Payment processor adapter: local (last-4 interim) or stripe (stub until configured)
app.payment.processor=${PAYMENT_PROCESSOR:local}
